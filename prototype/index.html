<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qoder 仿制 · 制作电商海报技能</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#ffffff; --sidebar:#fafafa;
  --text:#1a1a1a; --text-2:#666666; --text-3:#999999;
  --border:#e5e5e5; --accent:#00a86b;
  --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Fira Code",Consolas,monospace;
}
html,body { height:100%; }
body {
  font-family:var(--font); font-size:13px; line-height:1.7;
  color:var(--text); background:var(--bg);
  display:flex; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============ 侧边栏 ============ */
.sidebar {
  width:280px; flex-shrink:0; background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-header {
  display:flex; align-items:center; gap:8px; padding:12px 14px 10px;
}
.logo {
  width:24px; height:24px; border-radius:6px; background:var(--accent);
  display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700;
}
.sidebar-header .app-title { font-size:12px; font-weight:600; }
.sidebar-header .app-title small { display:block; font-size:10px; color:var(--text-3); font-weight:400; }

.nav { padding:4px 8px; }
.nav-item {
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--radius);
  font-size:12px; color:var(--text-2); cursor:pointer; user-select:none;
}
.nav-item:hover { background:rgba(0,0,0,.04); }
.nav-item .icon { width:14px; text-align:center; font-size:12px; }
.nav-item .star { margin-left:auto; color:#f5a623; opacity:0; }
.nav-item:hover .star { opacity:1; }

.section-label {
  padding:10px 16px 4px; font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-3);
}
.workspace { padding:0 8px; flex:1; overflow-y:auto; }
.group { margin-bottom:2px; }
.group-head {
  display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:11px;
  color:var(--text-3); cursor:pointer; user-select:none;
}
.group-head .icon { font-size:11px; }
.group-items { margin-left:14px; }
.session-item {
  display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:5px;
  font-size:12px; color:var(--text-2); cursor:pointer;
}
.session-item:hover { background:rgba(0,0,0,.04); }
.session-item.active { background:rgba(0,0,0,.06); color:var(--text); font-weight:500; }
.session-item .more { margin-left:auto; color:var(--text-3); font-size:12px; opacity:0; }
.session-item:hover .more { opacity:1; }

/* ============ 主区 ============ */
.main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
.topbar {
  display:flex; align-items:center; gap:8px; padding:10px 24px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.topbar .doc-icon { color:var(--text-3); }
.topbar .title { font-size:12px; font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .model-chip {
  font-size:11px; padding:2px 8px; border-radius:5px; background:rgba(0,0,0,.05); color:var(--text-2);
}

.chat { flex:1; overflow-y:auto; padding:24px 0; }
.chat-inner { max-width:720px; margin:0 auto; padding:0 32px; }

.msg { margin-bottom:12px; }
.msg.user { text-align:right; }
.msg.user .bubble {
  display:inline-block; background:#f0f0f0; padding:8px 14px; border-radius:12px;
  font-size:13px; text-align:left; max-width:80%;
}
.msg.assistant { font-size:13px; line-height:1.65; }
.msg.assistant h3 { font-size:14px; font-weight:600; margin:10px 0 6px; color:var(--text); }
.msg.assistant p { margin:0 0 6px; }
.msg.assistant p:last-child { margin-bottom:0; }
.msg.assistant ul { margin:4px 0 6px; padding-left:18px; }
.msg.assistant li { margin-bottom:3px; }
.msg.assistant li strong { font-weight:600; }

.divider { border:0; border-top:1px solid var(--border); margin:14px 0; }
.inline-code {
  font-family:var(--mono); font-size:11.5px; background:rgba(0,0,0,.06);
  padding:1px 5px; border-radius:4px; color:#c2410c;
}

.sources { margin-top:16px; }
.sources .label { font-size:11px; color:var(--text-3); margin-bottom:6px; }
.source-item {
  display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; color:var(--text-2);
}
.source-item .globe { width:14px; text-align:center; color:var(--text-3); font-size:12px; }
.source-item .src-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.msg-footer {
  display:flex; align-items:center; gap:14px; margin-top:10px;
  color:var(--text-3); font-size:13px;
}
.msg-footer .foot-btn { cursor:pointer; transition:color .12s; }
.msg-footer .foot-btn:hover { color:var(--text); }

/* ============ 组件卡 ============ */
.component { margin:10px 0; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:#fff; }
.component-head { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; user-select:none; background:#fafafa; }
.component-head:hover { background:#f5f5f5; }
.component-head .component-count { font-size:11px; color:var(--text-3); }
.component-head .component-toggle { margin-left:auto; font-size:11px; color:var(--text-3); }
.component-body { display:none; padding:10px 12px; border-top:1px solid var(--border); }
.component-body.open { display:block; }
.file-list { margin-bottom:8px; }
.file-head { display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--text-3); margin-bottom:6px; }
.file-download-all { color:var(--accent); cursor:pointer; }
.file-row { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:5px; font-size:12px; cursor:pointer; }
.file-row:hover { background:rgba(0,0,0,.03); }
.file-icon { width:14px; text-align:center; font-size:11px; }
.file-name { flex:1; color:var(--text); }
.file-size { font-size:11px; color:var(--text-3); }
.file-dl { font-size:11px; color:var(--accent); background:none; border:none; cursor:pointer; padding:2px 6px; border-radius:4px; }
.file-dl:hover { background:rgba(0,168,107,.08); }
.allowed-row { display:flex; align-items:center; gap:8px; padding:4px 6px; font-size:12px; color:var(--text-2); }
.allowed-toggle { width:26px; height:15px; border-radius:8px; background:#ddd; position:relative; cursor:pointer; flex-shrink:0; transition:background .15s; }
.allowed-toggle.on { background:var(--accent); }
.allowed-toggle::after { content:''; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:#fff; transition:transform .15s; }
.allowed-toggle.on::after { transform:translateX(11px); }
.file-preview { margin-top:8px; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.preview-head { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:#fafafa; font-size:12px; font-weight:500; }
.preview-close { cursor:pointer; color:var(--text-3); }
.preview-code { margin:0; padding:10px; font-family:var(--mono); font-size:11px; line-height:1.6; color:var(--text-2); background:#fff; max-height:180px; overflow:auto; white-space:pre-wrap; }
.preview-actions { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--border); }

/* ============ 输入区 ============ */
.composer { flex-shrink:0; border-top:1px solid var(--border); padding:14px 32px 10px; }
.composer-inner { max-width:760px; margin:0 auto; }
.composer-box {
  border:1px solid var(--border); border-radius:8px; padding:10px 12px;
  display:flex; flex-direction:column; gap:8px; background:#fff;
}
.composer-box:focus-within { border-color:#bbb; }
.composer-box textarea {
  border:none; outline:none; resize:none; font-family:var(--font); font-size:13px;
  color:var(--text); background:transparent; min-height:20px; max-height:120px;
}
.composer-box textarea::placeholder { color:var(--text-3); }
.composer-toolbar { display:flex; align-items:center; gap:2px; }
.toolbar-btn {
  width:26px; height:26px; border-radius:5px; display:grid; place-items:center;
  color:var(--text-3); font-size:13px; cursor:pointer; border:none; background:none;
}
.toolbar-btn:hover { background:rgba(0,0,0,.05); color:var(--text); }
.composer-toolbar .spacer { flex:1; }
.model-select {
  font-size:11px; color:var(--text-2); padding:3px 8px; border-radius:5px;
  border:1px solid var(--border); background:#fff; cursor:pointer;
}
.send-btn {
  width:26px; height:26px; border-radius:5px; border:none;
  background:var(--accent); color:#fff; font-size:13px; cursor:pointer;
  display:grid; place-items:center;
}
.send-btn:hover { opacity:.9; }
.composer-chips { display:flex; gap:6px; margin-top:8px; }
.chip {
  font-size:11px; padding:3px 10px; border-radius:12px;
  border:1px solid var(--border); color:var(--text-2); cursor:pointer; background:#fff;
}
.chip:hover { border-color:#bbb; }
.chip.active { background:rgba(0,168,107,.08); border-color:rgba(0,168,107,.4); color:var(--accent); }
</style>
</head>
<body>

<!-- ============ 侧边栏 ============ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">Q</div>
    <div class="app-title">Qoder<small>制作电商海报技能</small></div>
  </div>

  <div class="nav">
    <div class="nav-item"><span class="icon">＋</span>新的任务</div>
    <div class="nav-item"><span class="icon">◎</span>需要我<span class="star">★</span></div>
    <div class="nav-item"><span class="icon">🔍</span>搜索</div>
  </div>

  <div class="section-label">工作区</div>
  <div class="workspace" id="sessionList">
    <!-- 动态渲染 -->
  </div>
</aside>

<!-- ============ 主区 ============ -->
<main class="main">
  <div class="topbar">
    <span class="doc-icon">📋</span>
    <span class="title">制作电商海报技能</span>
    <span class="model-chip">Qwen3.6-Max</span>
  </div>

  <div class="chat" id="chat">
    <div class="chat-inner" id="chatInner">
      <!-- 动态渲染 -->
    </div>
  </div>

  <!-- ============ 输入区 ============ -->
  <div class="composer">
    <div class="composer-inner">
      <div class="composer-box">
        <textarea id="composerInput" rows="1" placeholder="输入消息，/ 使用技能，@ 选择文件…"></textarea>
        <div class="composer-toolbar">
          <button class="toolbar-btn" title="文件">📎</button>
          <button class="toolbar-btn" title="技能">⚡</button>
          <span class="spacer"></span>
          <select class="model-select" id="modelSelect">
            <option>Qwen3.6-Max</option>
            <option>Qwen3.6-Plus</option>
            <option>DeepSeek-V4</option>
          </select>
          <button class="send-btn" id="sendBtn" title="发送">↑</button>
        </div>
      </div>
      <div class="composer-chips">
        <span class="chip active">技能 · 制作电商海报技能</span>
        <span class="chip">Ask Anything</span>
        <span class="chip">Plan</span>
        <span class="chip">Quest</span>
      </div>
    </div>
  </div>
</main>

<script>
/* ==================== 设计 token ==================== */
const SESSIONS = [
  { group: '网站开发', items: ['请你帮我美化这份PPT，另外…'] },
  { group: '电商', items: ['电商海报设计技能分析', '制作电商海报技能'] },
  { group: '脚本开发', items: ['脚本添加RAG和自定义AI模型'] },
  { group: 'Qoder', items: ['“Cannot read properties of u…', '“https://w6jdx.srzx.com/”帮我…', 'Invalid schema for function ‘…', '社团方案优化', '修复 DeepSeek 不可用'] },
];

const SKILL_ALLOWED = ['可用的上下文', '相关插件', '可参考材料', '可参考素材'];
const SOURCES = [
  'AI电商必看：GPT image 2生成61张品牌视觉…',
  'AI Image Prompting for Ecommerce…',
  'AI 5步搞定618电商大促，9张创意…',
  '调教出一个AI海报设计“私教”，手把手教你…',
  'Logo颜色如何影响购买决策？你的…',
  '电商Banner图设计之色彩的奥秘',
];
const SKILL_MESSAGES = [
  { role: 'user', content: '帮我生成一份制作电商海报的技能，要能解放运营的双手，让运营直接出图。' },
  { role: 'assistant', content: `好的，这是你的「制作电商海报技能」，已经打包好了。用一句话就能出图。

[可折叠组件] 制作电商海报技能 (6 个文件)

**涵盖能力**

• **9 大电商品类** — 覆盖全场景
• **色调翻车四忌** — 直接来自PPT，这是实战中最常见的问题
• **黄金比例60/30/10** — 主色/辅色/点缀色的面积比，保证色彩不混乱
• **风格翻车辨析** — 中式≠大红灯笼、韩系≠加滤镜，帮用户避开符号堆砌
• **研判输出格式化** — 让AI的反馈具体到颜色/字体/位置/大小，而不是空泛评价` },
  { role: 'assistant', content: `Skill文件位于 \`C:\\Users\\15282\\.qoder\\skills\\ecommerce-poster-design\\SKILL.md\`。你可以通过调用 \`ecommerce-poster-design\` 来使用它。需要我调整或补充什么内容吗？` },
];
const SKILL_COMPONENTS = { title: '制作电商海报技能', count: 6 };
const SKILL_FILES = ['SKILL.md', 'prompt.md', 'reference.md', 'examples.md', 'checklist.md', 'README.md'];

/* ==================== 渲染 ==================== */
function renderSessions() {
  const el = document.getElementById('sessionList');
  el.innerHTML = SESSIONS.map(g => `
    <div class="group">
      <div class="group-head"><span class="icon">📁</span>${g.group}</div>
      <div class="group-items">
        ${g.items.map((s, i) => `<div class="session-item${g.group==='电商' && s==='制作电商海报技能' ? ' active' : ''}" data-group="${g.group}" data-idx="${i}">${s}<span class="more">⋯</span></div>`).join('')}
      </div>
    </div>
  `).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

function renderMarkdown(text) {
  const lines = text.split('\n');
  let html = '', inList = false, para = [];
  const flushPara = () => {
    if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; }
  };
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<span class="inline-code">$1</span>');

  for (const line of lines) {
    if (/^• /.test(line)) {
      flushPara();
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.slice(2)) + '</li>';
    } else if (line.trim() === '') {
      flushPara(); closeList();
    } else {
      closeList();
      para.push(inline(line));
    }
  }
  flushPara(); closeList();
  return html;
}

function renderChat() {
  const el = document.getElementById('chatInner');
  let html = '';
  SKILL_MESSAGES.forEach((m, idx) => {
    if (m.role === 'user') {
      html += `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`;
      return;
    }
    let body = m.content.replace('[可折叠组件] 制作电商海报技能 (6 个文件)\n\n', '');
    html += `<div class="msg assistant">${renderMarkdown(body)}</div>`;
    if (idx === 1) html += renderComponentCard();
  });
  // 最后一条 assistant 后加 Sources + footer
  html += renderSources();
  html += renderFooter();
  el.innerHTML = html;
  bind();
}

function renderComponentCard() {
  return `
  <div class="component">
    <div class="component-head" id="componentHead">
      <span>📋</span>
      <span>制作电商海报技能</span>
      <span class="component-count">${SKILL_COMPONENTS.count} 个文件</span>
      <span class="component-toggle" id="componentToggle">▸</span>
    </div>
    <div class="component-body" id="componentBody">
      <div class="file-list">
        <div class="file-head">
          <span>${SKILL_FILES.length} 个文件</span>
          <span class="file-download-all">全部下载</span>
        </div>
        ${SKILL_FILES.map(f => `
          <div class="file-row" data-file="${f}">
            <span class="file-icon">📄</span>
            <span class="file-name">${f}</span>
            <span class="file-size">${f === 'SKILL.md' ? '3.9 KB' : f === 'reference.md' ? '3.3 KB' : f === 'prompt.md' ? '2.6 KB' : f === 'examples.md' ? '1.8 KB' : f === 'checklist.md' ? '1.7 KB' : '0.5 KB'}</span>
            <button class="file-dl">下载</button>
          </div>
        `).join('')}
      </div>
      <div class="file-preview" id="filePreview" hidden>
        <div class="preview-head">
          <span class="preview-name" id="previewName"></span>
          <span class="preview-close" id="previewClose">✕</span>
        </div>
        <pre class="preview-code" id="previewCode"></pre>
        <div class="preview-actions">
          <button class="btn small" id="previewDownload">下载本文件</button>
          <button class="btn small ghost" id="previewAdd">添加到上下文</button>
        </div>
      </div>
      ${SKILL_ALLOWED.map((name, i) => `
        <div class="allowed-row">
          <span class="allowed-toggle ${i < 2 ? 'on' : ''}"></span>
          <span class="allowed-name">${name}</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderSources() {
  return `
  <div class="sources">
    <div class="label">Sources</div>
    ${SOURCES.map(s => `<div class="source-item"><span class="globe">🌐</span><span class="src-title">${esc(s)}</span></div>`).join('')}
  </div>`;
}

function renderFooter() {
  return `<div class="msg-footer">
    <span class="foot-btn" title="复制">📋</span>
    <span class="foot-btn" title="赞">👍</span>
    <span class="foot-btn" title="踩">👎</span>
    <span class="foot-btn" title="重生成">🔄</span>
    <span class="foot-btn" title="更多">⋯</span>
  </div>`;
}

/* ==================== 交互 ==================== */
function bind() {
  // 折叠组件
  const head = document.getElementById('componentHead');
  const body = document.getElementById('componentBody');
  if (head && body) {
    head.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      document.getElementById('componentToggle').textContent = open ? '▾' : '▸';
    });
  }
  // 文件行预览
  document.querySelectorAll('.file-row').forEach(row => {
    row.addEventListener('click', () => {
      const f = row.dataset.file;
      document.getElementById('previewName').textContent = f;
      document.getElementById('previewCode').textContent = '# ' + f + '\n\n(已下载内容)';
      document.getElementById('filePreview').hidden = false;
    });
  });
  // 预览关闭
  const close = document.getElementById('previewClose');
  if (close) close.addEventListener('click', () => { document.getElementById('filePreview').hidden = true; });
  // 下载
  document.querySelectorAll('.file-dl').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const f = btn.closest('.file-row').dataset.file;
      downloadFile(f);
    });
  });
  // 全部下载
  document.querySelectorAll('.file-download-all').forEach(el => {
    el.addEventListener('click', () => SKILL_FILES.forEach((f, i) => setTimeout(() => downloadFile(f), i * 100)));
  });
  // 输入
  const input = document.getElementById('composerInput');
  const send = document.getElementById('sendBtn');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  send.addEventListener('click', sendMessage);
  // 会话切换
  document.querySelectorAll('.session-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.session-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
    });
  });
  // 添加文件内容到输入框
  document.querySelectorAll('.allowed-toggle').forEach(t => {
    t.addEventListener('click', () => t.classList.toggle('on'));
  });
}

function downloadFile(f) {
  const text = `# ${f}\n\nQoder 技能文件 · 制作电商海报技能\n\n(此处为演示内容)`;
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = f;
  a.click();
  URL.revokeObjectURL(a.href);
}

function sendMessage() {
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById('chatInner');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(div);
  input.value = '';
  input.style.height = 'auto';
  setTimeout(() => {
    const reply = document.createElement('div');
    reply.className = 'msg assistant';
    reply.innerHTML = '<p>收到，正在处理…</p>';
    chat.appendChild(reply);
    chat.scrollTop = chat.scrollHeight;
  }, 300);
  chat.scrollTop = chat.scrollHeight;
}

/* ==================== 初始化 ==================== */
renderSessions();
renderChat();
</script>
