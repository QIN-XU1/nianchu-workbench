<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench v3</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   v3 的两个根本改动
   ──────────────────────────────────────────────────────────────────────
   1. 加「页面」概念（路由）。v1/v2 全是面板，所以技能/MCP/模型/智能体无处安身。
      v3 的主区是一个路由：会话 / 能力 / 设置 三种视图。
      「能力」视图下再分 技能 / MCP / 工具 / 模型 / 智能体 五类。
   2. 配色换成单条中性灰阶（学 AionUi 的 Arco 体系）：
      --bg-base / --bg-1..4 同时充当背景、边框、文字底色，
      同一把尺子量所有灰，所以不会出现暖褐灰那种"脏"的感觉。
      AionUi 暗色是 #0e0e0e / #1a1a1a / #262626 / #333333 纯中性。
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;

  /* 字号：AionUi 这类桌面应用的正文是 14，标题 16/20，不用 11px 撑满屏 */
  --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
  --fs-16: 16px; --fs-20: 20px; --fs-24: 24px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;

  --r-4: 4px; --r-6: 6px; --r-8: 8px; --r-12: 12px; --r-full: 999px;

  --density-scale: 1;
  --sp-2: calc(2px * var(--density-scale));
  --sp-4: calc(4px * var(--density-scale));
  --sp-6: calc(6px * var(--density-scale));
  --sp-8: calc(8px * var(--density-scale));
  --sp-10: calc(10px * var(--density-scale));
  --sp-12: calc(12px * var(--density-scale));
  --sp-16: calc(16px * var(--density-scale));
  --sp-20: calc(20px * var(--density-scale));
  --sp-24: calc(24px * var(--density-scale));
  --sp-32: calc(32px * var(--density-scale));

  --topbar-h: 48px;
  --sider-w: 268px;
  --sider-min: 208px;
  --sider-max: 420px;
  --work-w: 320px;

  --dur-fast: 120ms; --dur: 180ms; --dur-slow: 260ms;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 0.84, 0.44, 1);
  --z-menu: 60; --z-ghost: 70; --z-modal: 80;
}

/* ── 暗色：纯中性灰阶 ── */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg-base: #0e0e10;
  --bg-1: #17171a;
  --bg-2: #202024;
  --bg-3: #2b2b30;
  --bg-4: #383840;
  --bg-hover: #1d1d21;
  --bg-active: #282830;
  --text-1: #f4f4f6;
  --text-2: #c3c6cd;
  --text-3: #959aa4;
  --text-4: #737883;
  --border: #2b2b30;
  --border-strong: #3c3c45;
  --primary: #5b8cff;
  --primary-soft: rgba(91, 140, 255, 0.14);
  --st-pass: #3fbf8f;   --st-pass-soft: rgba(63, 191, 143, 0.14);
  --st-warn: #e0a33c;   --st-warn-soft: rgba(224, 163, 60, 0.14);
  --st-fail: #f06a6d;   --st-fail-soft: rgba(240, 106, 109, 0.14);
  --st-unknown: #9aa3b0; --st-unknown-soft: rgba(154, 163, 176, 0.13);
  --code-bg: #141417;
  --sel: rgba(91, 140, 255, 0.24);
}
/* ── 亮色 ── */
:root[data-theme="light"] {
  color-scheme: light;
  --bg-base: #ffffff;
  --bg-1: #f7f8fa;
  --bg-2: #f2f3f5;
  --bg-3: #e5e6eb;
  --bg-4: #d0d3da;
  --bg-hover: #f0f1f4;
  --bg-active: #e8e9ee;
  --text-1: #10141c;
  --text-2: #454d5f;
  --text-3: #646b7a;
  --text-4: #868d9b;
  --border: #e5e6eb;
  --border-strong: #d0d3da;
  --primary: #165dff;
  --primary-soft: rgba(22, 93, 255, 0.10);
  --st-pass: #12855a;   --st-pass-soft: rgba(18, 133, 90, 0.10);
  --st-warn: #96620b;   --st-warn-soft: rgba(150, 98, 11, 0.10);
  --st-fail: #c22f34;   --st-fail-soft: rgba(194, 47, 52, 0.09);
  --st-unknown: #5c636e; --st-unknown-soft: rgba(92, 99, 110, 0.09);
  --code-bg: #f4f5f7;
  --sel: rgba(22, 93, 255, 0.18);
}
:root[data-density="compact"] { --density-scale: 0.86; }
:root[data-density="cozy"] { --density-scale: 1.14; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-base); color: var(--text-1);
  font-family: var(--font-ui); font-size: var(--fs-14); line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-wrap: pretty; overflow: hidden;
}
::selection { background: var(--sel); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: var(--r-full); border: 3px solid transparent; background-clip: content-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-4); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: var(--r-full); flex: none; }
.dot.pass { background: var(--st-pass); } .dot.warn { background: var(--st-warn); }
.dot.fail { background: var(--st-fail); } .dot.unknown { background: var(--st-unknown); }

/* ══════ 骨架：侧栏 + 主区（主区是路由）══════ */
.app { display: flex; height: 100vh; }

.sider {
  width: var(--sider-w); min-width: var(--sider-min); max-width: var(--sider-max);
  flex: none; display: flex; flex-direction: column;
  background: var(--bg-1); border-right: 1px solid var(--border);
  min-height: 0;
}
.sider-top { flex: none; padding: var(--sp-12) var(--sp-12) var(--sp-8); }
.who {
  display: flex; align-items: center; gap: var(--sp-8);
  padding: var(--sp-6) var(--sp-6); border-radius: var(--r-6);
  width: 100%; text-align: left;
  transition: background var(--dur-fast) var(--ease);
}
.who:hover { background: var(--bg-hover); }
.who .av {
  width: 26px; height: 26px; border-radius: var(--r-6); flex: none;
  background: var(--bg-3); border: 1px solid var(--border-strong);
  display: grid; place-items: center;
  font-size: 11px; font-weight: var(--fw-semibold); color: var(--text-2);
}
.who .nm { font-size: var(--fs-13); font-weight: var(--fw-medium); color: var(--text-1); }
.who .sub { font-size: var(--fs-11); color: var(--text-4); }
.who .caret { margin-left: auto; color: var(--text-4); font-size: 10px; }

.search { display: flex; align-items: center; gap: var(--sp-6); margin-top: var(--sp-8); }
.search .wrap {
  flex: 1; display: flex; align-items: center; gap: var(--sp-6);
  height: 30px; padding: 0 var(--sp-8);
  background: var(--bg-2); border: 1px solid transparent; border-radius: var(--r-6);
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.search .wrap:focus-within { border-color: var(--primary); background: var(--bg-base); }
.search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text-1); font: inherit; font-size: var(--fs-12); outline: none; }
.search input::placeholder { color: var(--text-4); }
.search kbd { font-family: var(--font-mono); font-size: 10px; color: var(--text-4); border: 1px solid var(--border-strong); border-radius: 3px; padding: 0 3px; }

/* 侧栏一级导航：四个功能区 */
.nav { flex: none; padding: var(--sp-6) var(--sp-8); }
.nav-item {
  display: flex; align-items: center; gap: var(--sp-8);
  width: 100%; height: 32px; padding: 0 var(--sp-8);
  border-radius: var(--r-6); text-align: left;
  font-size: var(--fs-13); color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-1); }
.nav-item[aria-current="true"] { background: var(--bg-3); color: var(--text-1); font-weight: var(--fw-medium); }
.nav-item .ico { width: 16px; text-align: center; font-size: 12px; color: var(--text-4); }
.nav-item[aria-current="true"] .ico { color: var(--primary); }
.nav-item .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-4); }

/* 侧栏二级列表 */
.sider-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-4) var(--sp-8) var(--sp-12); }
.grp-h {
  display: flex; align-items: center; gap: var(--sp-6);
  padding: var(--sp-10) var(--sp-6) var(--sp-4);
  font-size: var(--fs-11); font-weight: var(--fw-medium);
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4);
}
.grp-h .n { font-family: var(--font-mono); letter-spacing: 0; }
.row {
  display: flex; align-items: center; gap: var(--sp-8);
  width: 100%; padding: var(--sp-6) var(--sp-8);
  border-radius: var(--r-6); text-align: left;
  transition: background var(--dur-fast) var(--ease);
}
.row:hover { background: var(--bg-hover); }
.row[aria-selected="true"] { background: var(--bg-active); }
.row .nm { font-size: var(--fs-13); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row[aria-selected="true"] .nm { color: var(--text-1); font-weight: var(--fw-medium); }
.row .tail { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-4); flex: none; }
.row .tail.run { color: var(--st-warn); }

.sider-foot {
  flex: none; border-top: 1px solid var(--border);
  padding: var(--sp-8) var(--sp-10);
  display: flex; align-items: center; gap: var(--sp-6);
}
.ghost-btn {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  height: 28px; padding: 0 var(--sp-8); border-radius: var(--r-6);
  font-size: var(--fs-12); color: var(--text-3); border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.ghost-btn:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border); }
.ghost-btn[aria-pressed="true"] { background: var(--bg-3); color: var(--text-1); border-color: var(--border-strong); }
.sider-foot .spacer { flex: 1; }

/* ══════ 主区 ══════ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-base); min-height: 0; }
.main-head {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: var(--sp-10);
  padding: 0 var(--sp-20); border-bottom: 1px solid var(--border);
}
.main-head .ttl { font-size: var(--fs-16); font-weight: var(--fw-semibold); letter-spacing: -0.01em; }
.main-head .sub { font-size: var(--fs-12); color: var(--text-4); font-family: var(--font-mono); }
.main-head .spacer { flex: 1; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ══════ 会话视图 ══════ */
.conv { flex: 1; min-height: 0; display: flex; }
.conv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-24) 0 var(--sp-12); }
.chat-inner { max-width: 760px; margin: 0 auto; padding: 0 var(--sp-24); }

.turn { margin-bottom: var(--sp-24); }
.turn + .turn { margin-top: var(--sp-24); }
.who-line { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); }
.who-line .av {
  width: 22px; height: 22px; border-radius: var(--r-6);
  display: grid; place-items: center; font-size: 10px; font-family: var(--font-mono);
  background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border);
}
.who-line .name { font-size: var(--fs-12); font-weight: var(--fw-medium); color: var(--text-2); }
.who-line .ts { font-size: var(--fs-11); color: var(--text-4); font-family: var(--font-mono); }
.turn.user .who-line { justify-content: flex-end; }
.user-msg {
  background: var(--primary-soft); border-radius: var(--r-12);
  padding: var(--sp-10) var(--sp-16);
  font-size: var(--fs-14); line-height: 1.65; color: var(--text-1);
  max-width: 82%; margin-left: auto; width: fit-content;
}
.prose { font-size: var(--fs-14); line-height: 1.8; color: var(--text-1); }
.prose p { margin: 0 0 var(--sp-12); }
.prose p:last-child { margin-bottom: 0; }
.prose code {
  font-family: var(--font-mono); font-size: 12px;
  background: var(--bg-2); color: var(--text-2);
  padding: 1px 5px; border-radius: var(--r-4);
}
.prose b { font-weight: var(--fw-semibold); }

.tool { margin: var(--sp-10) 0; border: 1px solid var(--border); border-radius: var(--r-8); background: var(--bg-1); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-12); cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.tool-head:hover { background: var(--bg-hover); }
.tool-head .tn { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-1); }
.tool-head .arg { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-head .spacer { flex: 1; }
.tool-head .dur { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-4); }
.tool-body { border-top: 1px solid var(--border); background: var(--code-bg); padding: var(--sp-10) var(--sp-12); font-family: var(--font-mono); font-size: var(--fs-11); line-height: 1.7; color: var(--text-2); overflow-x: auto; }
.tool-body .add { background: var(--st-pass-soft); display: block; }
.tool-body .del { background: var(--st-fail-soft); display: block; }
.tool-body .ln { color: var(--text-4); display: inline-block; width: 2.2em; user-select: none; }

.turn-meta {
  display: flex; align-items: center; gap: var(--sp-10); flex-wrap: wrap;
  margin-top: var(--sp-10); padding-top: var(--sp-8); border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-4);
}
.turn-meta .k { color: var(--text-3); }

/* 验证带 */
.verify-strip {
  flex: none; height: 34px; border-top: 1px solid var(--border);
  display: flex; align-items: center;
}
/* 内层和正文同一个 760 居中线，否则验证带会和对话正文错开一截 */
.verify-strip > .vs-inner {
  width: 100%; max-width: 760px; margin: 0 auto; padding: 0 var(--sp-24);
  display: flex; align-items: center; gap: var(--sp-2);
}
.vs-label { font-size: var(--fs-11); font-weight: var(--fw-medium); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4); margin-right: var(--sp-6); }
.vs-chip {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  height: 24px; padding: 0 var(--sp-8); border-radius: var(--r-6);
  font-size: var(--fs-12); color: var(--text-2); border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.vs-chip:hover { background: var(--bg-hover); border-color: var(--border); }
.vs-chip .n { font-family: var(--font-mono); font-weight: var(--fw-medium); }
.vs-chip.dim { opacity: 0.45; }
.vs-spacer { flex: 1; }

.composer-wrap { flex: none; padding: 0 var(--sp-24) var(--sp-16); }
.composer {
  max-width: 760px; margin: 0 auto;
  border: 1px solid var(--border-strong); border-radius: var(--r-12);
  background: var(--bg-1);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.composer:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.composer textarea {
  width: 100%; resize: none; border: 0; background: none; color: var(--text-1);
  font: inherit; font-size: var(--fs-14); padding: var(--sp-12) var(--sp-16) var(--sp-8);
  min-height: 46px; max-height: 180px; outline: none; display: block;
}
.composer textarea::placeholder { color: var(--text-4); }
.composer-bar { display: flex; align-items: center; gap: var(--sp-6); padding: var(--sp-6) var(--sp-8) var(--sp-8); }
.pill {
  display: inline-flex; align-items: center; gap: var(--sp-4);
  height: 26px; padding: 0 var(--sp-8); border-radius: var(--r-6);
  border: 1px solid var(--border); font-size: var(--fs-11); color: var(--text-3);
  transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.pill:hover { border-color: var(--border-strong); color: var(--text-1); }
.composer-bar .spacer { flex: 1; }
.send {
  height: 26px; padding: 0 var(--sp-12); border-radius: var(--r-6);
  background: var(--primary); color: #fff;
  font-size: var(--fs-12); font-weight: var(--fw-medium);
  transition: filter var(--dur-fast) var(--ease);
}
.send:hover { filter: brightness(1.1); }

/* 右工作区 */
.work {
  width: var(--work-w); flex: none; border-left: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--bg-1); min-height: 0;
}
.work-tabs { flex: none; display: flex; gap: var(--sp-2); padding: var(--sp-8) var(--sp-8) 0; border-bottom: 1px solid var(--border); }
.wtab {
  height: 28px; padding: 0 var(--sp-8); border-radius: var(--r-6) var(--r-6) 0 0;
  font-size: var(--fs-12); color: var(--text-4); border: 1px solid transparent; border-bottom: 0;
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.wtab:hover { color: var(--text-1); }
.wtab[aria-selected="true"] { color: var(--text-1); background: var(--bg-base); border-color: var(--border); margin-bottom: -1px; }
.work-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-12) var(--sp-12); }
.work-sec { margin-bottom: var(--sp-16); }
.work-sec h3 { margin: 0 0 var(--sp-8); font-size: var(--fs-11); font-weight: var(--fw-medium); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4); }

.kv { display: flex; align-items: baseline; gap: var(--sp-8); padding: var(--sp-4) var(--sp-6); border-radius: var(--r-4); }
.kv:hover { background: var(--bg-hover); }
.kv .k { font-size: var(--fs-12); color: var(--text-2); }
.kv .v { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-3); }

.vrow { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-8); padding: var(--sp-8) var(--sp-6); border-radius: var(--r-6); font-size: var(--fs-12); }
.vrow:hover { background: var(--bg-hover); }
.vrow + .vrow { border-top: 1px solid var(--border); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 var(--sp-6);
  border-radius: var(--r-4); font-size: var(--fs-11); font-weight: var(--fw-medium);
  border: 1px solid transparent; white-space: nowrap;
}
.chip.pass { color: var(--st-pass); background: var(--st-pass-soft); border-color: color-mix(in srgb, var(--st-pass) 30%, transparent); }
.chip.warn { color: var(--st-warn); background: var(--st-warn-soft); border-color: color-mix(in srgb, var(--st-warn) 30%, transparent); }
.chip.fail { color: var(--st-fail); background: var(--st-fail-soft); border-color: color-mix(in srgb, var(--st-fail) 30%, transparent); }
.chip.unknown { color: var(--st-unknown); background: var(--st-unknown-soft); border-color: color-mix(in srgb, var(--st-unknown) 30%, transparent); }
.vrow .what { grid-column: 2; color: var(--text-2); }
.vrow .ev { grid-column: 2; font-family: var(--font-mono); font-size: 10px; color: var(--text-4); }

/* ══════ 能力视图 ══════ */
.cap { flex: 1; min-height: 0; display: flex; }
.cap-nav { width: 176px; flex: none; border-right: 1px solid var(--border); padding: var(--sp-12) var(--sp-8); background: var(--bg-1); }

// ══════════════════════════════════════════════════════════════════════
//  1. 路由模型 —— v3 的核心：主区是一个路由，不是一堆面板

// ══════════════════════════════════════════════════════════════════════
const SECTIONS = [
  { id: 'conversation', label: '会话',   ico: '◧' },
  { id: 'agents',       label: '智能体', ico: '◉' },
  { id: 'capabilities', label: '能力',   ico: '✳' },
  { id: 'automation',   label: '自动化', ico: '◷' },
];

/** 能力页的五个分类 —— 这就是"s kill/MCP 放哪"的答案 */
const CAP_KINDS = [
  { id: 'skills', label: '技能',   desc: '可被智能体调用的流程知识（SKILL.md）' },
  { id: 'mcp',    label: 'MCP',    desc: '外部工具服务器（stdio / SSE）' },
  { id: 'tools',  label: '工具',   desc: '内置工具及其权限' },
  { id: 'models', label: '模型',   desc: '供应商与模型' },
  { id: 'agents', label: '智能体', desc: '智能体的模型、技能与工具组合' },
];

/** 路由：{ view, section, kind?, item? }  —— 纯数据，可序列化、可断言 */
function makeRoute(view, extra = {}) {
  return { view, ...extra };
}
function routeKey(r) {
  return [r.view, r.section || '', r.kind || '', r.item || ''].join('/');
}
function parseRoute(str) {
  const [view, section, kind, item] = String(str || '').split('/');
  if (!SECTIONS.some((s) => s.id === view) && view !== 'settings') return makeRoute('conversation', { section: 'conversation' });
  return makeRoute(view, { section: section || view, kind: kind || undefined, item: item || undefined });
}
function isValidKind(k) { return CAP_KINDS.some((c) => c.id === k); }

/** 侧栏每个一级项对应的二级列表标题 */
function siderTitle(section) {

}

// 搜索：纯函数，可断言
function searchAll(q) {
  const needle = String(q || '').trim().toLowerCase();
  if (!needle) return [];
  const out = [];
  for (const c of CONVERSATIONS) if (c.nm.toLowerCase().includes(needle)) out.push({ kind: '会话', nm: c.nm, where: c.sc });
  for (const [kind, list] of [['技能', SKILLS], ['MCP', MCP], ['工具', TOOLS], ['模型', MODELS], ['智能体', AGENTS]]) {
    for (const it of list) {
      if (it.nm.toLowerCase().includes(needle) || (it.desc || '').toLowerCase().includes(needle)) out.push({ kind, nm: it.nm, where: it.src || it.transport || it.prov || '' });

  }
  return out;
}

let workTab = 'files';

function wire() {
  $nav.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.nav;
    if (id === 'capabilities') go(makeRoute('capabilities', { section: 'capabilities', item: capKind }));
    else if (id === 'conversation') go(makeRoute('conversation', { section: 'conversation', item: CONVERSATIONS[0].id }));
    else if (id === 'agents') go(makeRoute('agents', { section: 'agents', item: AGENTS[0].id }));
    else go(makeRoute('automation', { section: 'automation' }));
  }));
  $siderBody.querySelectorAll('[data-conv]').forEach((b) => b.addEventListener('click', () => go(makeRoute('conversation', { section: 'conversation', item: b.dataset.conv }))));
  $siderBody.querySelectorAll('[data-cap]').forEach((b) => b.addEventListener('click', () => { capKind = b.dataset.cap; go(makeRoute('capabilities', { section: 'capabilities', item: capKind })); }));
  $siderBody.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => go(makeRoute('agents', { section: 'agents', item: b.dataset.agent }))));

  $view.querySelectorAll('[data-wtab]').forEach((b) => b.addEventListener('click', () => { workTab = b.dataset.wtab; render(); }));
  $view.querySelectorAll('[data-vtab]').forEach((b) => b.addEventListener('click', () => { workTab = 'verify'; render(); }));
  $view.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const [kind, id] = b.dataset.toggle.split(':');
    const list = capItems(kind);
    const it = list.find((x) => x.id === id);
    if (it) { it.on = !it.on; render(); }
  }));
  $view.querySelectorAll('[data-open-caps]').forEach((b) => b.addEventListener('click', () => go(makeRoute('capabilities', { section: 'capabilities', item: 'skills' }))));
  const ta = $view.querySelector('.composer textarea');
  if (ta) {
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; };
    ta.addEventListener('input', fit); fit();
  }
  const sT = document.getElementById('sTheme');
  if (sT) sT.addEventListener('click', () => document.getElementById('btnTheme').click());
  const sD = document.getElementById('sDensity');
  if (sD) sD.addEventListener('click', () => document.getElementById('btnDensity').click());
}

// 命令面板
const palette = document.getElementById('palette');
const pIn = document.getElementById('paletteInput');
const pList = document.getElementById('paletteList');
let palCur = [];
function buildCommands() {
  const cmds = [
    { kind: '会话', label: '接口审批链路加固', where: '架构梳理', run: () => go(makeRoute('conversation', { section: 'conversation', item: 'c1' })) },
    { kind: '页面', label: '能力 · 技能', where: '✳', run: () => { capKind = 'skills'; go(makeRoute('capabilities', { section: 'capabilities', item: 'skills' })); } },
    { kind: '页面', label: '能力 · MCP', where: '⛁', run: () => { capKind = 'mcp'; go(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' })); } },
    { kind: '页面', label: '能力 · 工具', where: '⚒', run: () => { capKind = 'tools'; go(makeRoute('capabilities', { section: 'capabilities', item: 'tools' })); } },
    { kind: '页面', label: '能力 · 模型', where: '◎', run: () => { capKind = 'models'; go(makeRoute('capabilities', { section: 'capabilities', item: 'models' })); } },
    { kind: '页面', label: '设置', where: '⚙', run: () => go(makeRoute('settings', { section: 'settings' })) },
  ];
  for (const it of searchAll(query)) {
    cmds.push({ kind: it.kind, label: it.nm, where: it.where, run: () => {} });
  }
  return cmds;
}
function buildPalette(q) {
  palCur = buildCommands();
  const needle = q.trim().toLowerCase();
  const hits = palCur.filter((c) => !needle || (c.label + c.kind + c.where).toLowerCase().includes(needle));
  pList.innerHTML = hits.map((c) => `<div class="pal-item" data-cmd="${palCur.indexOf(c)}" aria-selected="false">
    <span class="kind">${esc(c.kind)}</span><span class="lbl">${esc(c.label)}</span><span class="where">${esc(c.where)}</span></div>`).join('');
  pList.querySelectorAll('.pal-item').forEach((el) => el.addEventListener('click', () => runCmd(Number(el.dataset.cmd))));
  const first = pList.querySelector('.pal-item');
  if (first) first.setAttribute('aria-selected', 'true');
  return hits;
}
let palCursor = 0;
function runCmd(i) { const c = palCur[i]; if (!c) return; openPalette(false); c.run?.(); }
function openPalette(open) {
  palette.dataset.open = open ? 'true' : 'false';
  if (open) { pIn.value = ''; query = ''; buildPalette(''); palCursor = 0; pIn.focus(); }
}
document.addEventListener('keydown', (e) => {
  const open = palette.dataset.open === 'true';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(!open); return; }
  if (!open) return;
  const items = [...pList.querySelectorAll('.pal-item')];
  if (e.key === 'Escape') { e.preventDefault(); openPalette(false); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    palCursor = (palCursor + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.setAttribute('aria-selected', String(i === palCursor)));
    items[palCursor].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); const el = items[palCursor]; if (el) runCmd(Number(el.dataset.cmd)); }
});
palette.addEventListener('click', (e) => { if (e.target === palette) openPalette(false); });
pIn.addEventListener('input', (e) => { query = e.target.value; buildPalette(query); palCursor = 0; });

document.getElementById('btnLayout').addEventListener('click', () => openPalette(true));

const root = document.documentElement;

const bDensity = document.getElementById('btnDensity');
const densities = ['normal', 'compact', 'cozy'];
const dLabel = { normal: '标准', compact: '紧凑', cozy: '宽松' };
bTheme.addEventListener('click', () => {
  const dark = root.dataset.theme !== 'light';
  root.dataset.theme = dark ? 'light' : 'dark';
  bTheme.textContent = dark ? '亮' : '暗';
  localStorage.setItem('workbench.theme', root.dataset.theme);
});
bDensity.addEventListener('click', () => {
  const i = densities.indexOf(root.dataset.density || 'normal');
  const next = densities[(i + 1) % densities.length];
  root.dataset.density = next;
  bDensity.textContent = dLabel[next];
  localStorage.setItem('workbench.density', next);
});
(function restore() {
  const t = localStorage.getItem('workbench.theme');
  if (t === 'light' || t === 'dark') { root.dataset.theme = t; bTheme.textContent = t === 'light' ? '亮' : '暗'; }
  const d = localStorage.getItem('workbench.density');
  if (densities.includes(d)) { root.dataset.density = d; bDensity.textContent = dLabel[d]; }
})();

  t('分类合法性：isValidKind 认得 skills / mcp', () => isValidKind('skills') && isValidKind('mcp') && !isValidKind('nope'));
  t('侧栏标题：每个一级区都有标题', () => SECTIONS.every((s) => !!siderTitle(s.id)));
  t('搜索：空查询返回空（不是返回全部）', () => searchAll('').length === 0);
  t('搜索：能搜到技能', () => searchAll('verify').some((x) => x.kind === '技能'));
  t('搜索：能搜到 MCP', () => searchAll('playwright').some((x) => x.kind === 'MCP'));
  t('搜索：无匹配返回空', () => searchAll('zzzzzz').length === 0);
  t('智能体的技能数不超过技能总数', () => AGENTS.every((a) => a.skills <= SKILLS.length));
  t('智能体的 MCP 数不超过 MCP 总数', () => AGENTS.every((a) => a.mcp <= MCP.length));
  t('每个会话都绑定了一个场景', () => CONVERSATIONS.every((c) => !!c.sc));
  t('深链接：view+kind 能还原能力页分类', () => {
    const r = parseRoute(routeKey(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' })));
    return r.view === 'capabilities' && isValidKind(r.item) && r.item === 'mcp';
  });
  t('会话视图一定能找到要显示的会话（不会白屏）', () => {
    const r = parseRoute('conversation/conversation/zzz');
    const c = CONVERSATIONS.find((x) => x.id === r.item) || CONVERSATIONS[0];
    return !!c;
  });

  const bad = results.filter((r) => !r.ok);
  const out = [
    '  路由与信息架构自检  ' + (results.length - bad.length) + '/' + results.length + ' 成立',
    ...results.map((r) => '  ' + (r.ok ? '✓' : '✗') + ' ' + r.name + (r.detail ? '   ← ' + r.detail : '')),
    '  结论: ' + (bad.length ? '✗ ' + bad.length + ' 项不成立' : '✓ 全部成立'),
  ].join('\n');
  return { text: out, ok: bad.length === 0, pass: results.length - bad.length, total: results.length };
}

// ── 启动：URL 深链接优先于上次位置 ──
const bootParams = new URLSearchParams(location.search);
const qView = bootParams.get('view');
const qKind = bootParams.get('kind');
const qItem = bootParams.get('item');
const saved = localStorage.getItem('workbench.route');
if (saved) route = parseRoute(saved);
if (qKind && isValidKind(qKind)) capKind = qKind;
if (qView) {
  if (qView === 'capabilities') route = makeRoute('capabilities', { section: 'capabilities', item: capKind });
  else if (qView === 'agents') route = makeRoute('agents', { section: 'agents', item: qItem || AGENTS[0].id });
  else if (qView === 'automation') route = makeRoute('automation', { section: 'automation' });
  else if (qView === 'settings') route = makeRoute('settings', { section: 'settings' });
  else route = makeRoute('conversation', { section: 'conversation', item: qItem || CONVERSATIONS[0].id });
}
if (route.item && isValidKind(route.item)) capKind = route.item;
render();

const params = new URLSearchParams(location.search);
if (params.get('selftest') === '1') {
  const r = selfTest();
  const el = document.getElementById('selftest');
  el.textContent = 'SELFTEST_BEGIN\n' + r.text + '\nSELFTEST_END\nRESULT ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
  el.style.display = 'block';
  document.title = 'SELFTEST ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
}
window.__selfTest = selfTest;
</script>
</body>
</html>
