<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench v5</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  v5：按 DSH 的真实设计令牌重做，去掉 Arco 的企业后台气质
  ──────────────────────────────────────────────────────────────────────
  用户的判断：Cherry Studio 那种「像很多年前的老产物」，要的是
  ChatGPT / Claude Code / DeepSeek Harness 这类。

  我不靠感觉，把 DSH 自己的样式从 app.asar 里抽出来读了：
    dsh-client-ui-theme/src/styles/design-platform.css   (474 条变量)
    dsh-client-ui-sidebar/src/client/SidebarRoot.module.css
    dsh-client-ui-conversation/src/client/skeleton/ConversationRoot.module.css

  实测出来的关键事实（这就是"现代"与"老"的差别）：
    · 半径  xs4 / sm8 / md12 / lg16 / xl20 / panel28    —— 我原来是 4/6/8
    · 边框  rgba(0,0,0,.04) ~ .16，几乎看不见
            侧栏 22KB CSS 里只有 6 处非零 border，会话 21KB 只有 2 处
    · 底色  neutral-bluish 一整套，暗色底是 #0f1115（不是纯黑也不发暖）
    · 阴影  lv1 = 0 2px 4px rgba(0,0,0,.05)  —— 极轻，不是堆叠
    · 分区  靠间距和层级，不靠框线

  所以 v5 只保留两样外来物：Lucide 图标（Cherry Studio 与 DSH 都在用）、
  以及从 DSH 逐字抄来的令牌。Arco 已移除 —— 它的控件气质正是被嫌"老"的部分。
  ══════════════════════════════════════════════════════════════════════
-->
<style>
/* ── 令牌：逐字取自 DSH design-platform.css，只做必要的语义别名 ── */
:root {
  --nb-00: #ffffff;   --nb-50: #f9fafb;   --nb-55: #f5f7fa;   --nb-60: #f5f6f7;
  --nb-75: #f1f3f5;   --nb-90: #edf0f4;   --nb-100: #ebEEf2;  --nb-150: #e9ecf2;
  --nb-200: #e1e5ee;  --nb-300: #cfd3d6;  --nb-400: #adb2b8;  --nb-500: #979da6;
  --nb-600: #81858c;  --nb-700: #61666b;  --nb-750: #43454a;  --nb-800: #353638;
  --nb-850: #2c2c2e;  --nb-875: #232324;  --nb-900: #1b1b1c;  --nb-950: #151517;
  --nb-1000: #0f1115;

  /* deepseek 品牌蓝 */
  --ds-400: #7aaaff;  --ds-450: #5686fe;  --ds-500: #4176e6;  --ds-600: #4868b2;

  /* 圆角：取自 open-design（small2 / medium4 / large8 / xlarge12 / 2xlarge16）。
     我原来用的 16/28 大圆角正是"老产物"观感的一部分。 */
  --radius-xs: 2px; --radius-sm: 4px; --radius-md: 8px;
  --radius-lg: 12px; --radius-xl: 16px; --radius-panel: 16px;

  /* 阴影：取自 open-design，起于 0 1px 0 .04 —— 轻到几乎只是"贴纸感" */
  --shadow-lv1: 0 1px 0 rgba(28, 27, 26, .04);
  --shadow-lv2: 0 1px 2px rgba(28, 27, 26, .05), 0 1px 3px rgba(28, 27, 26, .04);
  --shadow-lv3: 0 6px 24px rgba(28, 27, 26, .07), 0 2px 6px rgba(28, 27, 26, .04);

  /* 动效：open-design 的 8 级时长 */
  --dur-faster: 100ms; --dur-fast: 150ms; --dur-normal: 200ms; --dur-gentle: 250ms;
  /* z 序写成契约，按用途命名而不是随手取大数 */
  --z-menu: 9000;

  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  --sider-w: 252px;
  --ease: cubic-bezier(.25, .1, .25, 1);
  --dur: 160ms;
}
/* 暗色：按 DSH 的 neutral-bluish 深端取 */
:root, :root[data-theme='dark'] {
  color-scheme: dark;
  --bg-base: var(--nb-1000);
  --bg-1: var(--nb-950);
  --bg-2: var(--nb-900);
  --bg-3: var(--nb-875);
  --bg-hover: rgba(255, 255, 255, .045);
  --bg-active: rgba(255, 255, 255, .075);
  --text-1: #f2f4f7;
  --text-2: var(--nb-300);
  --text-3: var(--nb-500);
  --text-4: var(--nb-600);
  --border: rgba(255, 255, 255, .07);      /* DSH: 几乎看不见的细线 */
  --border-strong: rgba(255, 255, 255, .12);
  --st-pass: #4ed17e;  --st-pass-soft: rgba(78, 209, 126, .14);
  --st-warn: #f7ad31;  --st-warn-soft: rgba(247, 173, 49, .14);
  --st-fail: #f0666b;  --st-fail-soft: rgba(240, 102, 107, .14);
  --st-unknown: var(--nb-500); --st-unknown-soft: rgba(151, 157, 166, .13);
  --code-bg: #0b0d10;
  --accent-ink: #e8eaed;      /* 暗色下的"墨"其实是浅色 */
  --accent-ink-fg: #14161a;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg-base: var(--nb-00);
  --bg-1: var(--nb-55);
  --bg-2: var(--nb-75);
  --bg-3: var(--nb-100);
  --bg-hover: rgba(0, 0, 0, .035);
  --bg-active: rgba(0, 0, 0, .06);
  --text-1: #10141c;
  --text-2: var(--nb-700);
  --text-3: var(--nb-600);
  --text-4: var(--nb-500);
  --border: rgba(0, 0, 0, .07);
  --border-strong: rgba(0, 0, 0, .12);
  --st-pass: #0f7a4f;  --st-pass-soft: rgba(15, 122, 79, .10);
  --st-warn: #8a5c09;  --st-warn-soft: rgba(138, 92, 9, .10);
  --st-fail: #bf2f34;  --st-fail-soft: rgba(191, 47, 52, .09);
  --st-unknown: var(--nb-600); --st-unknown-soft: rgba(129, 133, 140, .10);
  --code-bg: var(--nb-50);
  --accent-ink: #202020;
  --accent-ink-fg: #fafafa;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-base); color: var(--text-1);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-wrap: pretty; overflow: hidden;
}
::selection { background: rgba(65, 118, 230, .26); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ds-450); outline-offset: 2px; border-radius: var(--radius-xs); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dot { width: 6px; height: 6px; border-radius: 999px; flex: none; display: inline-block; }
.dot.pass { background: var(--st-pass); } .dot.warn { background: var(--st-warn); }
.dot.fail { background: var(--st-fail); } .dot.unknown { background: var(--st-unknown); }

/* ══════ 骨架：侧栏与主区之间只有一条几乎看不见的线 ══════ */
.app { display: flex; height: 100vh; }
.sider {
  width: var(--sider-w); flex: none; display: flex; flex-direction: column;
  background: var(--bg-1); min-height: 0;
  border-right: 1px solid var(--border);
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg-base); }

/* ══════ 侧栏 ══════ */
.sider-top { padding: 14px 12px 8px; flex: none; }
.workspace {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 8px; border-radius: var(--radius-sm); text-align: left;
  transition: background var(--dur-fast) var(--ease);
}
.workspace:hover { background: var(--bg-hover); }
.workspace .av {
  width: 26px; height: 26px; border-radius: var(--radius-sm); flex: none;
  background: var(--bg-3); display: grid; place-items: center;
  font-size: 11px; font-weight: 600; color: var(--text-2);
}
.workspace .meta { min-width: 0; flex: 1; }
.workspace .nm { display: block; font-size: 13px; font-weight: 600; color: var(--text-1); }
.workspace .sub { display: block; font-size: 11px; color: var(--text-4); font-family: var(--font-mono); }
.workspace .chev { color: var(--text-4); display: grid; place-items: center; }

.search-wrap { padding: 2px 12px 10px; flex: none; }
.search {
  display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px;
  border-radius: var(--radius-sm); background: var(--bg-2);
  transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.search:focus-within { background: var(--bg-base); box-shadow: 0 0 0 1.5px var(--ds-500); }
.search .ic { color: var(--text-4); display: grid; place-items: center; flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--text-1);
  font: inherit; font-size: 12.5px; outline: none;
}
.search input::placeholder { color: var(--text-4); }

/* 一级导航：没有边框，靠 hover 底色与图标区分 */
.nav { padding: 0 8px 6px; flex: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px;
  padding: 0 10px; border-radius: var(--radius-sm); text-align: left;
  font-size: 13px; color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-1); }
.nav-item[aria-current='true'] { background: var(--bg-active); color: var(--text-1); font-weight: 500; }
.nav-item .ico { flex: none; color: var(--text-4); display: grid; place-items: center; }
.nav-item[aria-current='true'] .ico { color: var(--text-2); }
.nav-item .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-4); }

.list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 14px; }
.grp {
  padding: 14px 10px 5px; font-size: 11px; font-weight: 500;
  color: var(--text-4); letter-spacing: .01em;
  display: flex; align-items: center; gap: 6px;
}
.grp .n { font-family: var(--font-mono); font-weight: 400; }
.row {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 10px; border-radius: var(--radius-sm); text-align: left;
  font-size: 13px; color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.row:hover { background: var(--bg-hover); }
.row[aria-selected='true'] { background: var(--bg-active); color: var(--text-1); }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tail { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); flex: none; }
.row .tail.run { color: var(--st-warn); }

.sider-foot { flex: none; padding: 8px; display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm); display: grid; place-items: center;
  color: var(--text-4); transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.sider-foot .spacer { flex: 1; }

/* ══════ 顶栏：不加边框，用留白和主区底色分开 ══════ */
.topbar {
  height: 50px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 24px;
}
.topbar .title { font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
.topbar .crumb { font-size: 12.5px; color: var(--text-4); }
.topbar .spacer { flex: 1; }
.ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.ghost:hover { background: var(--bg-hover); color: var(--text-1); }
/* 主按钮：墨色，不是彩色。open-design 的 --accent 就是 #353535 这种墨，
   彩色只出现在"发送"这一个动作上 —— 于是界面不会到处是蓝。 */
.primary {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px;
  border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 500;
  background: var(--accent-ink); color: var(--accent-ink-fg);
  transition: opacity var(--dur-fast) var(--ease);
}
.primary:hover { opacity: .88; }

.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ══════ 会话：大留白，无卡片框 ══════ */
.conv { flex: 1; min-height: 0; display: flex; }
.conv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 0 8px; }
.chat-inner { max-width: 720px; margin: 0 auto; padding: 0 28px; }

.turn { margin-bottom: 30px; }
.who { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.who .name { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.who .ts { font-size: 11px; color: var(--text-4); font-family: var(--font-mono); }
.turn.user .who { justify-content: flex-end; }
.user-msg {
  background: var(--bg-2); border-radius: var(--radius-lg);
  padding: 11px 16px; max-width: 84%; margin-left: auto; width: fit-content;
  font-size: 14px; line-height: 1.65;
}
.prose { font-size: 13.5px; line-height: 1.75; }
.prose p { margin: 0 0 14px; }
.prose p:last-child { margin-bottom: 0; }
.prose code {
  font-family: var(--font-mono); font-size: 12.5px; background: var(--bg-2);
  padding: 1px 5px; border-radius: var(--radius-xs); color: var(--text-2);
}

/* 工具行：学 Claude Code / DSH —— 一行一条，没有卡片框，展开才见内容 */
.tool-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; margin: 2px 0; border-radius: var(--radius-sm);
  cursor: pointer; transition: background var(--dur-fast) var(--ease);
}
.tool-row:hover { background: var(--bg-hover); }
.tool-row .tn { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-1); }
.tool-row .arg {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tool-row .dur { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); flex: none; }
.tool-out {
  margin: 0 0 8px 19px; padding: 10px 12px;
  background: var(--code-bg); border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7;
  color: var(--text-2); overflow-x: auto;
}
.tool-out .add { display: block; background: var(--st-pass-soft); }
.tool-out .del { display: block; background: var(--st-fail-soft); }
.tool-out .ln { display: inline-block; width: 2.2em; color: var(--text-4); user-select: none; }

.turn-meta {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-4);
}
.turn-meta .k { color: var(--text-3); }

/* 验证带：无边框，只靠间距与验证数字本身 */
.verify-bar {
  flex: none; display: flex; align-items: center; gap: 2px; padding: 6px 28px 4px;
}
.verify-bar .label { font-size: 11px; color: var(--text-4); margin-right: 8px; }
.verify-bar .spacer { flex: 1; }
.vchip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border-radius: var(--radius-sm); font-size: 12px; color: var(--text-2);
  transition: background var(--dur-fast) var(--ease);
}
.vchip:hover { background: var(--bg-hover); }
.vchip .n { font-family: var(--font-mono); font-weight: 500; }
.vchip.dim { opacity: .4; }

/* 输入框：DSH 的 lg 半径 + 极轻阴影 */
.composer-wrap { flex: none; padding: 4px 28px 20px; }
.composer {
  max-width: 720px; margin: 0 auto;
  background: var(--bg-1); border-radius: var(--radius-lg);
  box-shadow: 0 0 0 1px var(--border), var(--shadow-lv1);
  transition: box-shadow var(--dur-fast) var(--ease);
}
.composer:focus-within { box-shadow: 0 0 0 1.5px var(--ds-500), var(--shadow-lv2); }
.composer textarea {
  width: 100%; resize: none; border: 0; background: none; color: var(--text-1);
  font: inherit; font-size: 14px; padding: 13px 16px 6px;
  min-height: 46px; max-height: 180px; outline: none; display: block;
}
.composer textarea::placeholder { color: var(--text-4); }
.composer-bar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 9px; }
.composer-bar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border-radius: var(--radius-sm); font-size: 11.5px; color: var(--text-3);
  font-family: var(--font-mono);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.pill:hover { background: var(--bg-hover); color: var(--text-1); }
/* 发送：界面上唯一保留品牌色的动作（学 open-design 只给一个动作上色） */
.send {
  height: 28px; padding: 0 14px; border-radius: var(--radius-sm);
  background: var(--ds-500); color: #fff; font-size: 12.5px; font-weight: 500;
  transition: opacity var(--dur-fast) var(--ease);
}
.send:hover { opacity: .9; }

/* 右工作区：去掉左边框，用底色区分 */
.work {
  width: 300px; flex: none; background: var(--bg-1);
  display: flex; flex-direction: column; min-height: 0;
}
.work-tabs { flex: none; display: flex; gap: 2px; padding: 16px 14px 4px; }
.wtab {
  height: 28px; padding: 0 10px; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--text-4);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.wtab:hover { background: var(--bg-hover); color: var(--text-2); }
.wtab[aria-selected='true'] { background: var(--bg-active); color: var(--text-1); }
.work-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px 16px; }
.kv { display: flex; align-items: baseline; gap: 10px; padding: 6px 8px; border-radius: var(--radius-xs); }
.kv:hover { background: var(--bg-hover); }
.kv .k { font-size: 12.5px; color: var(--text-2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); flex: none; }
.sec-h { font-size: 11px; color: var(--text-4); margin: 16px 8px 6px; }
.sec-h:first-child { margin-top: 4px; }
.vrow { display: grid; grid-template-columns: auto 1fr; gap: 3px 9px; padding: 8px; border-radius: var(--radius-sm); font-size: 12.5px; }
.vrow:hover { background: var(--bg-hover); }
.vrow .chip {
  display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px;
  border-radius: var(--radius-xs); font-size: 11px; font-weight: 500; white-space: nowrap;
}
.chip.pass { color: var(--st-pass); background: var(--st-pass-soft); }
.chip.warn { color: var(--st-warn); background: var(--st-warn-soft); }
.chip.fail { color: var(--st-fail); background: var(--st-fail-soft); }
.chip.unknown { color: var(--st-unknown); background: var(--st-unknown-soft); }
.vrow .what { grid-column: 2; color: var(--text-2); }
.vrow .ev { grid-column: 2; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-4); }

/* ══════ 能力页：没有表头、没有竖线，就是干净的列表 ══════ */
.cap { flex: 1; min-height: 0; overflow-y: auto; }
.cap-inner { max-width: 880px; margin: 0 auto; padding: 8px 32px 40px; }
.cap-head { margin-bottom: 4px; }
.cap-head h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
.cap-desc { font-size: 13px; color: var(--text-3); margin: 6px 0 18px; }

.crow {
  display: grid; grid-template-columns: minmax(0, 1fr) 132px 116px 52px;
  align-items: center; gap: 16px;
  padding: 12px 10px; border-radius: var(--radius-sm);
  transition: background var(--dur-fast) var(--ease);
}
.crow:hover { background: var(--bg-hover); }
.crow + .crow { box-shadow: inset 0 1px 0 var(--border); }  /* DSH 式：一条 0.07 的细线，不是真边框 */
.crow .c1 { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
.crow .c1 .dot { margin-top: 7px; }

        <div class="tool-row"><span class="dot pass"></span><span class="tn">edit_file</span><span class="arg">tools/approval_detection.py · _path_fence_finding</span><span class="dur">0.08s</span></div>
        <div class="tool-out"><span class="ln">2</span><span class="add">+     # 判"删除落在哪"，不判"命令怎么拼" —— 所以分解无效</span><span class="ln">3</span><span class="add">+     targets = _PATHLIKE_RE.findall(command)</span><span class="ln">4</span><span class="add">+     if targets and not any(_inside(t) for t in targets):</span></div>
        <div class="prose">
          <p>挡住等价分解的关键不是加正则，而是<b>换个判据</b>：从「命令文本像不像危险」改成「删除落在哪」。前者可被任意改写绕过，后者不会。</p>
          <p>同理 <code>accepted ≠ success</code>：已写入不是已验证，判不了就说判不了。</p>
        </div>
        <div class="turn-meta"><span><span class="k">用时</span> 2.4s</span><span><span class="k">入</span> 12,841</span><span><span class="k">出</span> 486</span><span><span class="k">缓存</span> 76%</span><span><span class="k">成本</span> $0.0031</span></div>
      </div>
    </div></div>
    <div class="verify-bar"><span class="label">验证</span>
      ${VERIFY_COUNTS.map(([st, n, label]) => `<button class="vchip ${st === 'fail' && n === 0 ? 'dim' : ''}" data-vtab="${st}">
        <span class="dot ${st}"></span><span class="n">${n}</span> ${label}</button>`).join('')}
      <span class="spacer"></span><button class="vchip" data-vtab="verify">全部 →</button></div>
    <div class="composer-wrap"><div class="composer">
      <textarea rows="1" placeholder="问点什么，或 ⌘K 跳到能力 / 工具"></textarea>
      <div class="composer-bar">
        <button class="pill">mimo-v2.6-flash</button>
        <button class="pill" data-open-caps>${ICON('sparkles', 12)} 6 技能 · 2 MCP</button>
        <span class="spacer"></span>
        <button class="pill"><span class="dot pass"></span>38% · 64.2k / 168k</button>
        <button class="send">发送</button>
      </div></div></div>
  </div>${workHTML()}</div>`;
}
function capabilitiesHTML() {
  const kind = CAP_KINDS.find((c) => c.id === capKind) || CAP_KINDS[0];
  const list = capItems(kind.id);
  const cols = CAP_COLS[kind.id];
  return `<div class="cap"><div class="cap-inner">
    <div class="cap-head"><h2>${esc(kind.label)}</h2></div>
    <div class="cap-desc">${esc(kind.desc)}</div>
    ${list.length ? list.map((it) => {
      const [c2, c3] = capCell(kind.id, it);
      const st = it.st || (it.on ? 'pass' : 'unknown');
      return `<div class="crow">
        <div class="c1"><span class="dot ${st}"></span><div class="txt">
          <span class="nm">${esc(it.nm)}</span>${it.desc ? `<span class="dsc">${esc(it.desc)}</span>` : ''}</div></div>
        <div class="c2">${esc(c2)}</div>

          : ''}</div></div>`;
    }).join('') : `<div class="cap-desc">还没有配置</div>`}
  </div></div>`;
}

  return `<div class="cap"><div class="cap-inner"><div class="doc">
    <div class="cap-head"><h2>${esc(a.nm)}</h2></div>
    <div class="cap-desc">智能体 = 模型 + 技能 + MCP + 工具权限。三者在「能力」里配置，这里只做组合。</div>
    <div class="sec-h">已启用技能 ${a.skills}</div>

    <div class="sec-h">已连接 MCP ${a.mcp}</div>

    <div class="sec-h">工具权限</div>

function automationHTML() {

    ${CRON.map((k) => `<div class="doc-row"><span class="dot ${k.on ? 'pass' : 'unknown'}"></span>
      <span class="k">${esc(k.nm)}</span><span class="v">${esc(k.when)}</span>

function settingsHTML() {
  return `<div class="set"><div class="set-inner">
    <div class="set-sec"><h2>外观</h2>
      <div class="set-row"><span class="k">主题</span><span class="spacer"></span><button class="ghost" id="sTheme">跟随系统</button></div>
      <div class="set-row"><span class="k">信息密度</span><span class="d">只缩放间距，不改字号</span><span class="spacer"></span><button class="ghost">标准</button></div>
    </div>
    <div class="set-sec"><h2>模型网关</h2>
      <div class="set-row"><span class="k">本地网关</span><span class="d mono">http://127.0.0.1:3425/v1</span><span class="spacer"></span><span class="dot pass"></span></div>
      <div class="set-row"><span class="k">默认模型</span><span class="spacer"></span><span class="mono" style="font-size:12px;color:var(--text-4)">mimo-v2.6-flash</span></div>
    </div>
    <div class="set-sec"><h2>关于</h2>

      <div class="set-row"><span class="k">验收</span><span class="d">路由 18 断言 · 七套验收器</span><span class="spacer"></span><span class="dot pass"></span></div>
    </div>

function icons() { if (window.lucide?.createIcons) window.lucide.createIcons(); }

function render() {
  $nav.innerHTML = navHTML();
  $list.innerHTML = listHTML();
  $top.innerHTML = topbarHTML();
  $content.innerHTML = route.view === 'capabilities' ? capabilitiesHTML()
    : route.view === 'agents' ? agentsHTML()
    : route.view === 'automation' ? automationHTML()
    : route.view === 'settings' ? settingsHTML()
    : conversationHTML();
  icons(); wire();
  localStorage.setItem('workbench.route', routeKey(route));
}
function go(r) { route = r; render(); }

// ══════════════════════════════════════════════════════════════════════
//  5. 交互
// ══════════════════════════════════════════════════════════════════════
function wire() {
  $nav.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.nav;
    if (id === 'capabilities') go(makeRoute('capabilities', { section: 'capabilities', item: capKind }));
    else if (id === 'conversation') go(makeRoute('conversation', { section: 'conversation', item: CONVERSATIONS[0].id }));
    else if (id === 'agents') go(makeRoute('agents', { section: 'agents', item: AGENTS[0].id }));
    else go(makeRoute('automation', { section: 'automation' }));
  }));
  document.querySelectorAll('[data-conv]').forEach((b) => b.addEventListener('click', () => go(makeRoute('conversation', { section: 'conversation', item: b.dataset.conv }))));
  document.querySelectorAll('[data-cap]').forEach((b) => b.addEventListener('click', () => { capKind = b.dataset.cap; go(makeRoute('capabilities', { section: 'capabilities', item: capKind })); }));
  document.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => go(makeRoute('agents', { section: 'agents', item: b.dataset.agent }))));
  document.querySelectorAll('[data-wtab]').forEach((b) => b.addEventListener('click', () => { workTab = b.dataset.wtab; render(); }));
  document.querySelectorAll('[data-vtab]').forEach((b) => b.addEventListener('click', () => { workTab = 'verify'; render(); }));
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const [kind, id] = b.dataset.toggle.split(':');
    const it = capItems(kind).find((x) => x.id === id);
    if (it) { it.on = !it.on; render(); }
  }));
  document.querySelectorAll('[data-kron]').forEach((b) => b.addEventListener('click', () => {
    const k = CRON.find((x) => x.id === b.dataset.kron);
    if (k) { k.on = !k.on; render(); }
  }));
  document.querySelectorAll('[data-open-caps]').forEach((b) => b.addEventListener('click', () => go(makeRoute('capabilities', { section: 'capabilities', item: 'skills' }))));
  const ta = $content.querySelector('.composer textarea');
  if (ta) { const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; }; ta.addEventListener('input', fit); fit(); }
  const sT = document.getElementById('sTheme'); if (sT) sT.addEventListener('click', () => document.getElementById('btnTheme').click());
}

// 命令面板
const mask = document.getElementById('paletteMask');
const pIn = document.getElementById('paletteInput');
const pList = document.getElementById('paletteList');
let palCur = [];
function buildCommands() {
  const cmds = [
    { kind: '会话', label: '接口审批链路加固', where: '架构梳理', run: () => go(makeRoute('conversation', { section: 'conversation', item: 'c1' })) },
    ...CAP_KINDS.map((c) => ({ kind: '能力', label: c.label, where: c.id, run: () => { capKind = c.id; go(makeRoute('capabilities', { section: 'capabilities', item: c.id })); } })),
    { kind: '页面', label: '设置', where: 'settings', run: () => go(makeRoute('settings', { section: 'settings' })) },
  ];
  for (const it of searchAll(query)) cmds.push({ kind: it.kind, label: it.nm, where: it.where, run: () => {} });
  return cmds;
}
function buildPalette(q) {
  palCur = buildCommands();
  const needle = q.trim().toLowerCase();
  const hits = palCur.filter((c) => !needle || (c.label + c.kind + c.where).toLowerCase().includes(needle));
  pList.innerHTML = hits.map((c) => `<div class="pal-item" data-cmd="${palCur.indexOf(c)}" aria-selected="false">
    <span class="kind">${esc(c.kind)}</span><span class="lbl">${esc(c.label)}</span><span class="where">${esc(c.where)}</span></div>`).join('');
  pList.querySelectorAll('.pal-item').forEach((el) => el.addEventListener('click', () => runCmd(Number(el.dataset.cmd))));
  const first = pList.querySelector('.pal-item'); if (first) first.setAttribute('aria-selected', 'true');
  return hits;
}
let palCursor = 0;
function runCmd(i) { const c = palCur[i]; if (!c) return; openPalette(false); c.run?.(); }
function openPalette(open) {
  mask.dataset.open = open ? 'true' : 'false';
  if (open) { pIn.value = ''; query = ''; buildPalette(''); palCursor = 0; pIn.focus(); }
}
document.addEventListener('keydown', (e) => {
  const open = mask.dataset.open === 'true';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(!open); return; }
  if (!open) return;
  const items = [...pList.querySelectorAll('.pal-item')];
  if (e.key === 'Escape') { e.preventDefault(); openPalette(false); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!items.length) return;
    palCursor = (palCursor + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.setAttribute('aria-selected', String(i === palCursor)));
  } else if (e.key === 'Enter') { e.preventDefault(); const el = items[palCursor]; if (el) runCmd(Number(el.dataset.cmd)); }
});
mask.addEventListener('click', (e) => { if (e.target === mask) openPalette(false); });
pIn.addEventListener('input', (e) => { query = e.target.value; buildPalette(query); palCursor = 0; });
document.getElementById('btnPalette').addEventListener('click', () => openPalette(true));
document.getElementById('btnSettings').addEventListener('click', () => go(makeRoute('settings', { section: 'settings' })));
document.getElementById('btnTheme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  localStorage.setItem('workbench.scheme', dark ? 'light' : 'dark');
});
(function restore() {
  const s = localStorage.getItem('workbench.scheme');
  if (s === 'light' || s === 'dark') document.documentElement.dataset.theme = s;
})();

// ══════════════════════════════════════════════════════════════════════
//  6. 自检
// ══════════════════════════════════════════════════════════════════════
function selfTest() {
  const results = [];
  const t = (name, fn) => {
    try { const v = fn(); results.push({ name, ok: v === true, detail: v === true ? '' : String(v) }); }
    catch (e) { results.push({ name, ok: false, detail: '抛异常: ' + e.message }); }
  };
  t('路由：会话路由可序列化并还原', () => { const r = makeRoute('conversation', { section: 'conversation', item: 'c3' }); const b = parseRoute(routeKey(r)); return b.view === 'conversation' && b.item === 'c3'; });
  t('路由：能力路由带分类', () => parseRoute(routeKey(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' }))).item === 'mcp');
  t('路由：非法视图回落到会话（不白屏）', () => parseRoute('nonsense/xx/yy').view === 'conversation');
  t('路由：空字符串不崩', () => parseRoute('').view === 'conversation');
  t('能力分类：五个分类齐全', () => CAP_KINDS.length === 5);
  t('能力分类：技能与 MCP 都在其中（这就是它们的家）', () => CAP_KINDS.some((c) => c.id === 'skills') && CAP_KINDS.some((c) => c.id === 'mcp'));
  t('能力分类：每类都有条目', () => CAP_KINDS.every((c) => capItems(c.id).length > 0));
  t('分类合法性：isValidKind 认得 skills / mcp', () => isValidKind('skills') && isValidKind('mcp') && !isValidKind('nope'));
  t('每个一级区都有图标（不是字符占位）', () => SECTIONS.every((s) => !!s.icon) && CAP_KINDS.every((c) => !!c.icon));
  t('搜索：空查询返回空', () => searchAll('').length === 0);
  t('搜索：能搜到技能', () => searchAll('verify').some((x) => x.kind === '技能'));
  t('搜索：能搜到 MCP', () => searchAll('playwright').some((x) => x.kind === 'MCP'));
  t('搜索：无匹配返回空', () => searchAll('zzzzzz').length === 0);
  t('智能体的技能数不超过技能总数', () => AGENTS.every((a) => a.skills <= SKILLS.length));
  t('智能体的 MCP 数不超过 MCP 总数', () => AGENTS.every((a) => a.mcp <= MCP.length));
  t('每个会话都绑定了一个场景', () => CONVERSATIONS.every((c) => !!c.sc));
  t('深链接：view+kind 能还原能力页分类', () => { const r = parseRoute(routeKey(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' }))); return r.view === 'capabilities' && isValidKind(r.item) && r.item === 'mcp'; });
  t('每个能力条目都能算出两列元信息（不会空列）', () => CAP_KINDS.every((c) => capItems(c.id).every((it) => { const [a, b] = capCell(c.id, it); return a !== undefined && b !== undefined; })));

  const bad = results.filter((r) => !r.ok);
  const out = [
    '  路由与信息架构自检  ' + (results.length - bad.length) + '/' + results.length + ' 成立',
    ...results.map((r) => '  ' + (r.ok ? '✓' : '✗') + ' ' + r.name + (r.detail ? '   ← ' + r.detail : '')),
    '  结论: ' + (bad.length ? '✗ ' + bad.length + ' 项不成立' : '✓ 全部成立'),
  ].join('\n');
  return { text: out, ok: bad.length === 0, pass: results.length - bad.length, total: results.length };
}

const bp = new URLSearchParams(location.search);
const saved = localStorage.getItem('workbench.route');
if (saved) route = parseRoute(saved);
if (bp.get('kind') && isValidKind(bp.get('kind'))) capKind = bp.get('kind');
const qv = bp.get('view');
if (qv) {
  if (qv === 'capabilities') route = makeRoute('capabilities', { section: 'capabilities', item: capKind });
  else if (qv === 'agents') route = makeRoute('agents', { section: 'agents', item: bp.get('item') || AGENTS[0].id });
  else if (qv === 'automation') route = makeRoute('automation', { section: 'automation' });
  else if (qv === 'settings') route = makeRoute('settings', { section: 'settings' });
  else route = makeRoute('conversation', { section: 'conversation', item: bp.get('item') || CONVERSATIONS[0].id });
}
if (route.item && isValidKind(route.item)) capKind = route.item;
render();

if (bp.get('selftest') === '1') {
  const r = selfTest();
  const el = document.getElementById('selftest');
  el.textContent = 'SELFTEST_BEGIN\n' + r.text + '\nSELFTEST_END\nRESULT ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
  el.style.display = 'block';
  document.title = 'SELFTEST ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
}
window.__selfTest = selfTest;
</script>
