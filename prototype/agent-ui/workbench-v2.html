<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench v2</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   v2 布局：按「谁在干活 / 干活本身 / 干得怎么样」分三区
   ──────────────────────────────────────────────────────────────────────
   v1 的问题是三栏等权重、四处面板标题，没有主角。
   v2 的规则：
     · 每栏默认只有一个面板 —— 面板标题从 4 个降到 3 个，横线噪音减半
     · 中间栏底色比两侧亮一档 —— 让"干什么"从"底盘"上浮
     · 验证状态不再占一个面板，压成输入框上方一条常驻细带
       （它就在你动手的地方，而不是藏在右栏第二个面板里）
     · 左栏只回答"谁在干活"，右栏只回答"干得怎么样"
   配色哲学不变：颜色只表示状态，不表示装饰。
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  --fs-11: 11px; --fs-12: 12px; --fs-14: 14px; --fs-16: 16px; --fs-18: 18px; --fs-22: 22px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;

  --r-4: 6px; --r-6: 9px; --r-8: 12px; --r-10: 16px; --r-full: 999px;

  --density-scale: 1;
  --sp-2: calc(2px * var(--density-scale));
  --sp-4: calc(4px * var(--density-scale));
  --sp-6: calc(6px * var(--density-scale));
  --sp-8: calc(8px * var(--density-scale));
  --sp-10: calc(10px * var(--density-scale));
  --sp-12: calc(12px * var(--density-scale));
  --sp-14: calc(14px * var(--density-scale));
  --sp-16: calc(16px * var(--density-scale));
  --sp-20: calc(20px * var(--density-scale));
  --sp-24: calc(24px * var(--density-scale));
  --sp-32: calc(32px * var(--density-scale));

  --tap-min: 24px;
  --topbar-h: 44px;

  --dur-tactile: 80ms; --dur-fast: 120ms; --dur: 180ms; --dur-slow: 250ms;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 0.84, 0.44, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);

  --z-topbar: 20; --z-panel: 30; --z-menu: 60; --z-ghost: 70; --z-modal: 80;

  --shadow-float: 0 0 0 1px var(--border-strong), 0 10px 30px -14px rgba(0,0,0,0.55);
}

:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16120f;          /* 中间栏：正文所在，最亮的一层底 */
  --bg-inset: #0a0908;    /* 两侧栏：chrome */
  --surface: #221d19;
  --surface-2: #2c261f;
  --surface-3: #362f26;
  --surface-hover: rgba(255, 247, 235, 0.045);
  --border: rgba(255, 247, 235, 0.075);
  --border-strong: rgba(255, 247, 235, 0.13);
  --border-float: #8a7f72;
  --text: #efe9e1; --text-2: #b3a99c; --text-3: #968c7f; --text-faint: #8d8377;
  --glyph-faint: #6b6257;
  --st-pass: #4fc08d;  --st-pass-soft: rgba(79, 192, 141, 0.13);
  --st-warn: #e0a23c;  --st-warn-soft: rgba(224, 162, 60, 0.13);
  --st-fail: #f06568;  --st-fail-soft: rgba(240, 101, 104, 0.13);
  --st-unknown: #9aa3ad; --st-unknown-soft: rgba(154, 163, 173, 0.12);
  --focus: #7aa7d9;
  --code-bg: #151109;
  --diff-add-bg: rgba(79, 192, 141, 0.10);
  --diff-del-bg: rgba(240, 101, 104, 0.09);
  --scrollbar: rgba(255, 247, 235, 0.16);
  --selection: rgba(122, 167, 217, 0.22);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff;
  --bg-inset: #f7f4ef;
  --surface: #ffffff;
  --surface-2: #f2efea;
  --surface-3: #e8e4dd;
  --surface-hover: rgba(28, 24, 20, 0.04);
  --border: rgba(28, 24, 20, 0.09);
  --border-strong: rgba(28, 24, 20, 0.16);
  --border-float: #9b958c;
  --text: #1b1815; --text-2: #56504a; --text-3: #6b645c; --text-faint: #79726a;
  --glyph-faint: #9a9186;
  --st-pass: #167a52;  --st-pass-soft: rgba(22, 122, 82, 0.11);
  --st-warn: #8f5a05;  --st-warn-soft: rgba(143, 90, 5, 0.11);
  --st-fail: #c0272c;  --st-fail-soft: rgba(192, 39, 44, 0.09);
  --st-unknown: #5c636e; --st-unknown-soft: rgba(92, 99, 110, 0.10);
  --focus: #2b6cb0;
  --code-bg: #f4f1ec;
  --diff-add-bg: rgba(22, 122, 82, 0.10);
  --diff-del-bg: rgba(192, 39, 44, 0.08);
  --scrollbar: rgba(28, 24, 20, 0.18);
  --selection: rgba(43, 108, 176, 0.18);
}
:root[data-density="compact"] { --density-scale: 0.85; }
:root[data-density="cozy"] { --density-scale: 1.15; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-inset); color: var(--text);
  font-family: var(--font-ui); font-size: var(--fs-14); line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-wrap: pretty; overflow: hidden;
}
::selection { background: var(--selection); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: var(--r-full); border: 3px solid transparent; background-clip: content-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-4); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ══════ 顶栏：只放"这是哪个会话"和三个外观开关 ══════ */
.topbar {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: var(--sp-10);
  padding: 0 var(--sp-14);
  background: var(--bg-inset); border-bottom: 1px solid var(--border);
  z-index: var(--z-topbar);
}
.brand { display: flex; align-items: center; gap: var(--sp-8); font-weight: var(--fw-semibold); font-size: var(--fs-14); letter-spacing: -0.01em; }
.brand .mark {
  width: 20px; height: 20px; border-radius: var(--r-4);
  background: var(--surface-2); border: 1px solid var(--border-strong);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: var(--fw-semibold); color: var(--text);
}
.topbar .sep { width: 1px; height: 16px; background: var(--border); }
.session { display: flex; align-items: center; gap: var(--sp-8); min-width: 0; }
.session .sc {
  font-size: var(--fs-12); color: var(--text-3); white-space: nowrap;
}
.session .ti {
  font-size: var(--fs-14); color: var(--text); font-weight: var(--fw-medium);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session .id { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint); white-space: nowrap; }
.topbar .spacer { flex: 1; }
.tb-actions { display: flex; align-items: center; gap: var(--sp-2); }
.tbtn {
  height: var(--tap-min); padding: 0 var(--sp-8);
  border-radius: var(--r-4); border: 1px solid transparent;
  font-size: var(--fs-11); color: var(--text-3);
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.tbtn:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border); }
.tbtn[aria-pressed="true"] { color: var(--text); background: var(--surface-2); border-color: var(--border); }

/* ══════ 主体：三区 ══════ */
.body { flex: 1; min-height: 0; display: flex; }
.dock { flex: 1; min-width: 0; display: flex; }

.region {
  display: flex; flex-direction: column;
  min-width: 120px; min-height: 0;
  background: var(--bg-inset);
  border-right: 1px solid var(--border);
}
.region:last-child { border-right: 0; }
/* 中间栏底色亮一档 —— 这一条是 v2 最重要的视觉决定：
   "干什么"必须从"底盘"上浮出来，否则三栏等权重，眼睛没有落点。 */
.region[data-region="center"] { background: var(--bg); }
.region[data-empty="true"] { display: none; }
.region[data-drop="true"] { background: color-mix(in srgb, var(--focus) 7%, var(--bg-inset)); }

.splitter { width: 5px; flex: none; cursor: col-resize; background: transparent; position: relative; }
.splitter::after {
  content: ''; position: absolute; inset: 0 2px;
  background: var(--border); border-radius: var(--r-full);
  transition: background var(--dur-fast) var(--ease), inset var(--dur-fast) var(--ease);
}
.splitter:hover::after, .splitter[data-active="true"]::after { background: var(--focus); inset: 0 1px; }

/* ══════ 面板 ══════ */
.panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: transparent; }
.panel[data-collapsed="true"] { flex: 0 0 auto !important; }
.region[data-maximized="true"] .panel { flex: 1 !important; }

.panel-head {
  height: 34px; flex: none;
  display: flex; align-items: center; gap: var(--sp-6);
  padding: 0 var(--sp-6) 0 var(--sp-10);
  cursor: grab; user-select: none;
  transition: background var(--dur-fast) var(--ease);
}
.panel-head:hover { background: var(--surface-hover); }
.panel-head:active { cursor: grabbing; }
.panel-head::before {
  content: ""; width: 8px; height: 10px; flex: none; margin-right: 2px;
  background-image: radial-gradient(circle, var(--glyph-faint) 1px, transparent 1px);
  background-size: 4px 4px; border-radius: 2px;
  opacity: 0; transition: opacity var(--dur-fast) var(--ease);
}
.panel-head:hover::before { opacity: 0.85; }
.panel-head .ttl {
  font-size: var(--fs-11); font-weight: var(--fw-medium);
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint);
  white-space: nowrap;
}
.panel-head .badge { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint); margin-left: var(--sp-4); }
.panel-head .spacer { flex: 1; }
.panel:focus-within .ttl { color: var(--text); }
.pbtn {
  width: 20px; height: 20px; border-radius: var(--r-4);
  display: grid; place-items: center;
  color: var(--glyph-faint); font-size: 11px; line-height: 1;
  opacity: 0; transition: opacity var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.panel-head:hover .pbtn, .pbtn:focus-visible { opacity: 1; }
.pbtn:hover { background: var(--surface-2); color: var(--text); }
.panel-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

/* ══════ 左栏：谁在干活 ══════ */
/* 左侧栏和右栏的标题栏内边距，要和各自内容对齐 */
.side-search { flex: none; padding: var(--sp-8) var(--sp-10) var(--sp-6); }
.side-search .wrap {
  display: flex; align-items: center; gap: var(--sp-6);
  height: 28px; padding: 0 var(--sp-8);
  border: 1px solid var(--border); border-radius: var(--r-6);
  background: var(--surface);
  transition: border-color var(--dur-fast) var(--ease);
}
.side-search .wrap:focus-within { border-color: color-mix(in srgb, var(--focus) 60%, var(--border)); }
.side-search input {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--text);
  font: inherit; font-size: var(--fs-12); outline: none;
}
.side-search input::placeholder { color: var(--text-faint); }
.side-search kbd {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
}
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--sp-6) var(--sp-10); }

.grp { margin-bottom: var(--sp-10); }
.grp-h {
  display: flex; align-items: center; gap: var(--sp-6);
  padding: var(--sp-6) var(--sp-6) var(--sp-4);
  font-size: 10px; font-weight: var(--fw-medium);
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint);
}
.grp-h .n { font-family: var(--font-mono); letter-spacing: 0; }
.grp-h::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.scene {
  display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: var(--sp-8);
  width: 100%; padding: var(--sp-6) var(--sp-8); border-radius: var(--r-4); text-align: left;
  transition: background var(--dur-fast) var(--ease);
}
.scene:hover { background: var(--surface-hover); }
.scene[aria-selected="true"] { background: var(--surface-2); }
.scene .nm { font-size: var(--fs-12); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene[aria-selected="true"] .nm { color: var(--text); font-weight: var(--fw-medium); }
.scene .badge { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint); }
.scene .badge.run { color: var(--st-warn); }
.side-foot {
  flex: none; border-top: 1px solid var(--border);
  padding: var(--sp-8) var(--sp-10);
  font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint);
  display: flex; align-items: center; gap: var(--sp-6);
}
.side-empty { padding: var(--sp-16) var(--sp-10); font-size: var(--fs-12); color: var(--text-faint); text-align: center; }

.dot { width: 6px; height: 6px; border-radius: var(--r-full); flex: none; }
.dot.pass { background: var(--st-pass); }
.dot.warn { background: var(--st-warn); }
.dot.fail { background: var(--st-fail); }
.dot.unknown { background: var(--st-unknown); }

/* 中栏标题：场景名（弱）/ 会话标题（强）/ 元信息（最弱） */
.hd-scene { font-size: var(--fs-12); color: var(--text-3); }
.hd-title { font-size: var(--fs-13, 13px); color: var(--text); font-weight: var(--fw-medium); letter-spacing: -0.005em; }
.hd-id { font-size: var(--fs-11); color: var(--text-faint); }

/* ══════ 中间栏：会话 ══════ */
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-12) 0 var(--sp-8); }
/* 左对齐而不是居中：有左侧栏的工作台，内容左边缘要和标题对齐。
   居中会让"标题靠左、正文居中"变成两条打架的线。 */
.chat-inner { max-width: 860px; margin: 0; padding: 0 var(--sp-24); }

.turn { margin-bottom: var(--sp-24); }
.turn + .turn { border-top: 1px solid var(--border); padding-top: var(--sp-20); }
.who { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); }
.who .av {
  width: 20px; height: 20px; border-radius: var(--r-4);
  display: grid; place-items: center; font-size: 10px; font-family: var(--font-mono);
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.who .name { font-size: var(--fs-12); color: var(--text-2); font-weight: var(--fw-medium); }
.who .ts { font-size: var(--fs-11); color: var(--text-faint); font-family: var(--font-mono); }
.turn.user .who { justify-content: flex-end; }
.user-msg {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-8); padding: var(--sp-10) var(--sp-14);
  font-size: var(--fs-14); line-height: 1.62; color: var(--text);
  max-width: 80%; margin-left: auto; width: fit-content;
}
.prose { font-size: 15.5px; line-height: 1.78; color: var(--text); letter-spacing: 0.004em; }
.prose p { margin: 0 0 var(--sp-14); }
.prose p:last-child { margin-bottom: 0; }
.prose code {
  font-family: var(--font-mono); font-size: 12px;
  background: var(--code-bg); color: var(--text-2);
  padding: 1px 5px; border-radius: var(--r-4); border: 1px solid var(--border);
}
.prose b { font-weight: var(--fw-semibold); }

.tool { margin: var(--sp-10) 0; border: 1px solid var(--border); border-radius: var(--r-8); background: var(--surface); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-10); cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.tool-head:hover { background: var(--surface-hover); }
.tool-head .st { width: 6px; height: 6px; border-radius: var(--r-full); flex: none; }
.tool-head .tn { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text); }
.tool-head .arg { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-head .spacer { flex: 1; }
.tool-head .dur { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint); }
.tool-body { border-top: 1px solid var(--border); background: var(--code-bg); padding: var(--sp-10); font-family: var(--font-mono); font-size: var(--fs-11); line-height: 1.65; color: var(--text-2); overflow-x: auto; }
.tool-body .add { background: var(--diff-add-bg); display: block; }
.tool-body .del { background: var(--diff-del-bg); display: block; }
.tool-body .ln { color: var(--text-faint); display: inline-block; width: 2.2em; user-select: none; }

.turn-meta {
  display: flex; align-items: center; gap: var(--sp-10); flex-wrap: wrap;
  margin-top: var(--sp-8); padding-top: var(--sp-8);
  border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-faint);
}
.turn-meta .k { color: var(--text-3); }
.turn-meta .sep { width: 1px; height: 10px; background: var(--border); }

/* 本轮用量：右栏下半截的空白要由信息来填，不是靠留白撑着 */
.cu { margin-top: var(--sp-16); padding-top: var(--sp-12); border-top: 1px solid var(--border); }
.cu-h { font-size: 10px; font-weight: var(--fw-medium); letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint); margin-bottom: var(--sp-6); }
.cu-row { display: flex; align-items: baseline; gap: var(--sp-10); padding: var(--sp-4) var(--sp-6); border-radius: var(--r-4); }
.cu-row:hover { background: var(--surface-hover); }
.cu-row .k { font-size: var(--fs-12); color: var(--text-2); }
.cu-row .v { margin-left: auto; font-size: var(--fs-11); color: var(--text-3); }

/* ══════ 验证常驻细带：就在你动手的地方上方 ══════ */
.verify-strip {
  flex: none;
  height: 32px;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-24);
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.vs-chip {
  display: inline-flex; align-items: center; gap: var(--sp-6);
  height: 22px; padding: 0 var(--sp-8);
  border-radius: var(--r-4); border: 1px solid transparent;
  font-size: var(--fs-11); color: var(--text-2);
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.vs-chip:hover { background: var(--surface-hover); border-color: var(--border); }
.vs-chip .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: var(--fw-medium); }
.vs-chip.dim { opacity: 0.5; }
.vs-label {
  font-size: var(--fs-11); font-weight: var(--fw-medium); letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-faint); margin-right: var(--sp-6);
}
.vs-spacer { flex: 1; }
.vs-more {
  font-size: var(--fs-11); color: var(--text-faint);
  height: 22px; padding: 0 var(--sp-8); border-radius: var(--r-4);
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.vs-more:hover { color: var(--text); background: var(--surface-hover); }

.composer-wrap { flex: none; padding: 0 var(--sp-24) var(--sp-16); background: var(--bg); }
.composer {
  max-width: 860px; margin: 0;
  border: 1px solid var(--border-strong); border-radius: var(--r-10);
  background: var(--surface); box-shadow: var(--shadow-float);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.composer:focus-within {
  border-color: color-mix(in srgb, var(--focus) 55%, var(--border-strong));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 16%, transparent), var(--shadow-float);
}
.composer textarea {

/* ══════ 右栏：干得怎么样（一个面板 + 三个标签页）══════ */

<pre id="selftest" style="display:none"></pre>

<script type="module">
// ══════════════════════════════════════════════════════════════════════
//  1. 面板定义
//
//  v2 的关键改动：面板数从 6 降到 3（每栏一个）。
//  上下文/验证/变更 合并成右栏一个"检查器"面板的三个标签页 ——
//  四块面板标题变成一块，横线噪音减半，右栏宽度也不用被两个面板平分。
// ══════════════════════════════════════════════════════════════════════
const PANELS = {
  scenes:    { title: '场景',   region: 'left',   grow: true, badge: '12 · 2 跑' },
  fleet:     { title: '舰队',   region: 'left',   grow: true, optional: true, badge: '5' },
  chat:      { title: '会话',   region: 'center', grow: true, closable: false },
  inspector: { title: '检查器', region: 'right',  grow: true, badge: '上下文' },
  files:     { title: '文件',   region: 'right',  grow: true, optional: true },
};

const REGIONS = ['left', 'center', 'right'];

const DEFAULT_LAYOUT = {
  regions: {
    left:   ['scenes'],
    center: ['chat'],
    right:  ['inspector'],
  },
  sizes: { left: 248, center: 1, right: 320 },
  collapsed: {},
  weights: { scenes: 1, chat: 1, inspector: 1 },
  maximized: null,
};

// ══════════════════════════════════════════════════════════════════════
//  2. 布局运算——纯函数，独立可测
// ══════════════════════════════════════════════════════════════════════
function cloneLayout(l) {
  return {
    regions: { left: [...l.regions.left], center: [...l.regions.center], right: [...l.regions.right] },
    sizes: { ...l.sizes },
    collapsed: { ...l.collapsed },
    weights: { ...l.weights },
    maximized: l.maximized || null,
  };
}

function detach(layout, id) {
  for (const r of REGIONS) {
    const i = layout.regions[r].indexOf(id);
    if (i >= 0) layout.regions[r].splice(i, 1);
  }
}

function movePanel(layout, id, toRegion, toIndex) {
  if (!PANELS[id]) throw new Error('未知面板: ' + id);
  if (!REGIONS.includes(toRegion)) throw new Error('未知区域: ' + toRegion);
  const next = cloneLayout(layout);
  detach(next, id);
  const arr = next.regions[toRegion];
  const idx = Math.max(0, Math.min(Number.isFinite(toIndex) ? toIndex : arr.length, arr.length));
  arr.splice(idx, 0, id);
  return next;
}

function panelCount(layout) {
  return REGIONS.reduce((n, r) => n + layout.regions[r].length, 0);
}
function allPanelIds(layout) {
  return REGIONS.flatMap((r) => layout.regions[r]);
}
function locate(layout, id) {
  for (const r of REGIONS) {
    const i = layout.regions[r].indexOf(id);
    if (i >= 0) return { region: r, index: i };
  }
  return null;
}

function toggleMax(layout, id) {
  if (!PANELS[id] || !locate(layout, id)) return layout;
  const next = cloneLayout(layout);
  next.maximized = next.maximized === id ? null : id;
  return next;
}

function togglePanel(layout, id) {
  const next = cloneLayout(layout);
  if (locate(next, id)) {
    if (PANELS[id].closable === false) return next;
    detach(next, id);
    if (next.maximized === id) next.maximized = null;
  } else {
    return movePanel(next, id, PANELS[id].region, 999);
  }
  return next;
}

function serialize(layout) {
  return JSON.stringify({
    regions: layout.regions,
    sizes: layout.sizes,
    collapsed: layout.collapsed,
    weights: layout.weights,
    maximized: layout.maximized,
  });
}

function deserialize(raw) {
  const l = cloneLayout(DEFAULT_LAYOUT);
  if (!raw) return l;
  let parsed;
  try { parsed = JSON.parse(raw); } catch { return l; }
  if (!parsed || typeof parsed !== 'object') return l;

  const seen = new Set();
  for (const r of REGIONS) {
    const list = Array.isArray(parsed.regions?.[r]) ? parsed.regions[r] : [];
    l.regions[r] = list.filter((id) => PANELS[id] && !seen.has(id) && seen.add(id));
  }
  for (const id of Object.keys(PANELS)) {
    if (seen.has(id) || PANELS[id].optional) continue;
    l.regions[PANELS[id].region].push(id);
    seen.add(id);
  }
  for (const k of ['left', 'right', 'center']) {
    const v = parsed.sizes?.[k];
    if (typeof v === 'number' && Number.isFinite(v) && v > 0) l.sizes[k] = v;
  }
  if (parsed.collapsed && typeof parsed.collapsed === 'object') {
    for (const [k, v] of Object.entries(parsed.collapsed)) if (PANELS[k]) l.collapsed[k] = !!v;
  }
  if (parsed.weights && typeof parsed.weights === 'object') {
    for (const [k, v] of Object.entries(parsed.weights)) {
      if (PANELS[k] && typeof v === 'number' && Number.isFinite(v) && v > 0) l.weights[k] = v;
    }
  }
  if (typeof parsed.maximized === 'string' && PANELS[parsed.maximized] && locate(l, parsed.maximized)) {
    l.maximized = parsed.maximized;
  }
  return l;
}

// ══════════════════════════════════════════════════════════════════════
//  3. 数据（示例值，接真数据前先保证结构与信息密度是对的）
// ══════════════════════════════════════════════════════════════════════
const SCENES = [
  { nm: '架构梳理', st: 'pass', badge: '14', running: false, recent: true, sel: true },
  { nm: '后端工坊', st: 'warn', badge: '跑', running: true,  recent: true },
  { nm: '前端工坊', st: 'pass', badge: '9',  running: false, recent: true },
  { nm: '实施计划', st: 'pass', badge: '11', running: false, recent: false },
  { nm: '竞品拆解', st: 'unknown', badge: '3', running: false, recent: false },
  { nm: '中枢',     st: 'pass', badge: '21', running: false, recent: true },
  { nm: '故障分析', st: 'pass', badge: '6',  running: false, recent: false },
  { nm: '本地电脑', st: 'warn', badge: '跑', running: true,  recent: false },
  { nm: '调研',     st: 'pass', badge: '7',  running: false, recent: false },
  { nm: '逆向分析', st: 'pass', badge: '2',  running: false, recent: false },
  { nm: '自我复盘', st: 'pass', badge: '4',  running: false, recent: false },
  { nm: '工具工坊', st: 'pass', badge: '5',  running: false, recent: false },
];

/** 场景搜索：抽成纯函数，方便断言 */
function matchScene(scene, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return true;
  return scene.nm.toLowerCase().includes(q) || String(scene.badge).toLowerCase().includes(q);
}

const FLEET = [
  ['后端工坊', 'warn', '跑 2m14s', 'run'], ['本地电脑', 'warn', '跑 41s', 'run'],
  ['架构梳理', 'pass', '空闲', 'idle'], ['中枢', 'pass', '空闲', 'idle'],
  ['竞品拆解', 'unknown', '判不了', 'idle'],
];
const CTX = [
  ['system prompt', 8940, '14%', 'unknown', 70], ['skills', 3812, '6%', 'unknown', 45],
  ['内建工具', 5730, '9%', 'unknown', 58], ['自定义工具', 2604, '4%', 'unknown', 35],
  ['用户消息', 13486, '21%', 'pass', 55], ['助手消息', 16695, '26%', 'pass', 35],
  ['工具输出', 5137, '8%', 'warn', 45], ['思考', 5860, '9%', 'warn', 30],
  ['工具调用', 1950, '3%', null, 0],
];
const VERIFY_ROWS = [
  ['pass', '通过', '守卫拦截危险命令', 'tools/approval.py:1257'],
  ['pass', '通过', '-q 端到端拦住（金丝雀存活）', 'verify-a15.py:3'],
  ['warn', '待补', '多层分解仍可绕（无沙箱）', '_findings A15'],
  ['unknown', '判不了', '界面层未起，无法验证', 'verify-goal.mjs:96'],
  ['fail', '失败', '星图节点计数', 'verify-starmap.mjs:143'],
];
const CHANGES = [
  ['pass', 'tools/approval_detection.py', '+18'],
  ['pass', 'prototype/four-state.mjs', '+89'],
  ['fail', 'research/架构分层.md', '−4'],
];
const VERIFY_COUNTS = [
  ['pass', '106', '通过'], ['warn', '6', '待补'], ['fail', '0', '失败'], ['unknown', '2', '判不了'],
];
const INSP_TABS = [['context', '上下文'], ['verify', '验证'], ['changes', '变更']];
const FILES = [
  ['tools/approval_detection.py', '1257 行'],
  ['prototype/four-state.mjs', '89 行'],
  ['research/架构分层.md', '178 行'],
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ══════════════════════════════════════════════════════════════════════
//  4. 内容
// ══════════════════════════════════════════════════════════════════════
let sceneQuery = '';
let inspTab = 'context';   // 'context' | 'verify' | 'changes'  —— UI 状态，不进布局模型

function sceneRow(s) {
  return `<button class="scene" aria-selected="${!!s.sel}">
    <span class="dot ${s.st}"></span><span class="nm">${esc(s.nm)}</span>
    <span class="badge mono ${s.badge === '跑' ? 'run' : ''}">${esc(s.badge)}</span>
  </button>`;
}

function sceneGroup(label, list) {
  if (!list.length) return '';
  return `<div class="grp"><div class="grp-h">${esc(label)}<span class="n">${list.length}</span></div>${list.map(sceneRow).join('')}</div>`;
}

const CONTENT = {
  scenes: () => {
    const hits = SCENES.filter((s) => matchScene(s, sceneQuery));
    const running = hits.filter((s) => s.running);
    const recent = hits.filter((s) => s.recent && !s.running);
    const rest = hits.filter((s) => !s.recent && !s.running);
    return `
      <div class="side-search">
        <label class="wrap">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="sceneSearch" placeholder="搜索场景" value="${esc(sceneQuery)}" aria-label="搜索场景">
          <kbd>/</kbd>
        </label>
      </div>
      <div class="side-scroll">
        ${hits.length === 0 ? '<div class="side-empty">没有匹配的场景</div>'
          : sceneGroup('运行中', running) + sceneGroup('最近', recent) + sceneGroup('其它', rest)}
      </div>
      <div class="side-foot"><span class="dot warn"></span>2 在跑 · 6 待补 · 12 共</div>`;
  },

  fleet: () => `<div class="side-scroll" style="padding-top:var(--sp-6)">${FLEET.map(([nm, st, txt, cls]) =>
    `<div class="scene" style="cursor:default"><span class="dot ${st}"></span><span class="nm">${esc(nm)}</span><span class="badge mono">${esc(txt)}</span></div>`).join('')}</div>`,

  files: () => `<div class="tabpane">${FILES.map(([f, n]) =>
    `<div class="chg-row"><span class="dot unknown"></span><span class="nm">${esc(f)}</span><span class="st mono" style="color:var(--text-faint)">${esc(n)}</span></div>`).join('')}</div>`,

  inspector: () => `<div class="tabpane" id="inspPane">${inspPane()}</div>`,

  chat: () => `
    <div class="chat-scroll">
      <div class="chat-inner">
        <div class="turn user">
          <div class="who"><span class="av">你</span><span class="name">你</span><span class="ts">16:41</span></div>
          <div class="user-msg">把审批闸当成安全边界来审：它现在能不能挡住等价分解？挡不住的地方列出来，别只看正则。</div>
        </div>
        <div class="turn">
          <div class="who"><span class="av">架</span><span class="name">架构梳理</span><span class="ts">16:41</span></div>

// ══════════════════════════════════════════════════════════════════════
//  5. 渲染
// ══════════════════════════════════════════════════════════════════════
let layout = deserialize(localStorage.getItem('workbench.layout'));
const dock = document.getElementById('dock');

function weightOf(id) {
  const w = layout.weights[id];
  if (typeof w === 'number' && Number.isFinite(w) && w > 0) return w;
  return PANELS[id].grow ? 1 : 0;
}

function panelHTML(id) {
  const p = PANELS[id];
  const collapsed = !!layout.collapsed[id];
  const flexible = p.grow && !collapsed;
  const style = collapsed ? 'flex:0 0 auto' : flexible ? `flex:${weightOf(id)} 1 0px` : 'flex:0 0 auto';
  // 检查器不设徽标：标签页已经写着"上下文/验证/变更"，再标一次是冗余
  const badge = id === 'inspector' ? '' : p.badge;
  // 中栏标题不做成"会话"这种废话 —— 它回答三个具体问题：哪个场景、哪件事、多少条
  // 检查器的标题栏直接由标签页充当 —— 原来 34px 标题 + 34px 标签页，两行标签说同一件事
  const headInner = id === 'chat'
    ? `<span class="hd-scene">架构梳理</span><span class="hd-title">接口审批链路加固</span><span class="hd-id mono">42 条 · local-9f32…47875</span>`
    : id === 'inspector'
      ? `<div class="ih-tabs" role="tablist">${INSP_TABS.map(([k, label]) =>
          `<button class="ih-tab" role="tab" data-tab="${k}" aria-selected="${inspTab === k}">${label}</button>`).join('')}</div>`
      : `<span class="ttl">${esc(p.title)}</span>${badge ? `<span class="badge mono">${esc(badge)}</span>` : ''}`;
  return `<section class="panel" data-id="${id}" data-collapsed="${collapsed}" style="${style}">
    <div class="panel-head" data-drag="${id}" title="拖动换栏位 · 双击最大化">
      <button class="pbtn chev" data-collapse="${id}" title="${collapsed ? '展开' : '折叠'}">▾</button>
      ${headInner}
      <span class="spacer"></span>
      <button class="pbtn" data-max="${id}" title="最大化">⤢</button>
      ${p.closable === false ? '' : `<button class="pbtn" data-close="${id}" title="关闭">✕</button>`}
    </div>
    <div class="panel-body">${CONTENT[id] ? CONTENT[id]() : ''}</div>
  </section>`;
}

function regionHTML(r) {
  const ids = layout.regions[r];
  const empty = ids.length === 0;
  const size = layout.sizes[r];
  const style = r === 'center' ? 'flex:1' : (empty ? '' : `flex:0 0 ${size}px`);
  const inner = [];
  ids.forEach((id, i) => {
    inner.push(panelHTML(id));
    const nextId = ids[i + 1];
    const bothFlex = nextId && PANELS[id].grow && PANELS[nextId].grow;
    if (bothFlex && !layout.collapsed[id] && !layout.collapsed[nextId]) {
      inner.push(`<div class="split-h" data-hsplit="${r}:${i}" title="拖动调高度"></div>`);
    }
  });
  return `<div class="region" data-region="${r}" data-empty="${empty}" data-maximized="false" style="${style}">${inner.join('')}</div>`;
}

function captureRects() {
  const m = new Map();
  dock.querySelectorAll('.panel').forEach((el) => m.set(el.dataset.id, el.getBoundingClientRect()));
  return m;
}

function flipFrom(before) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  dock.querySelectorAll('.panel').forEach((el) => {
    const b = before.get(el.dataset.id);
    if (!b) return;
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    const sx = a.width ? b.width / a.width : 1;
    const sy = a.height ? b.height / a.height : 1;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
    el.animate(
      [
        { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, transformOrigin: 'top left' },
        { transform: 'none', transformOrigin: 'top left' },
      ],
      { duration: 240, easing: 'cubic-bezier(0.16, 0.84, 0.44, 1)' }
    );
  });
}

function persist() {
  localStorage.setItem('workbench.layout', serialize(layout));
}

function render() {
  const before = captureRects();
  const maxId = layout.maximized && PANELS[layout.maximized] && locate(layout, layout.maximized)
    ? layout.maximized : null;
  if (maxId) {
    layout.maximized = maxId;
    dock.innerHTML = `<div class="region" data-region="${PANELS[maxId].region}" data-maximized="true" style="flex:1">${panelHTML(maxId)}</div>`;
  } else {
    layout.maximized = null;
    const parts = [];
    REGIONS.forEach((r, i) => {
      parts.push(regionHTML(r));
      if (i < REGIONS.length - 1) parts.push(`<div class="splitter" data-split="${i}"></div>`);
    });
    dock.innerHTML = parts.join('');
  }
  wirePanels();
  persist();
  flipFrom(before);
}

// ══════════════════════════════════════════════════════════════════════
//  6. 交互
// ══════════════════════════════════════════════════════════════════════
function wirePanels() {
  dock.querySelectorAll('[data-collapse]').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); layout.collapsed[b.dataset.collapse] = !layout.collapsed[b.dataset.collapse]; render(); });
  });
  dock.querySelectorAll('[data-close]').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); detach(layout, b.dataset.close); render(); });
  });
  dock.querySelectorAll('[data-drag]').forEach((h) => h.addEventListener('pointerdown', startDrag));
  dock.querySelectorAll('.splitter').forEach((s) => s.addEventListener('pointerdown', startResize));
  dock.querySelectorAll('.split-h').forEach((s) => s.addEventListener('pointerdown', startResizeH));

  dock.querySelectorAll('.panel-head').forEach((h) => {
    h.addEventListener('dblclick', (e) => {
      if (e.target.closest('[data-collapse],[data-close],[data-max],[data-tab]')) return;
      layout = toggleMax(layout, h.dataset.drag);
      render();
    });
  });
  dock.querySelectorAll('[data-max]').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); layout = toggleMax(layout, b.dataset.max); render(); });
  });

  // 检查器标签页：只改 UI 状态，不进布局模型
  dock.querySelectorAll('[data-tab]').forEach((t) => {
    t.addEventListener('click', () => {
      inspTab = t.dataset.tab;
      render();
    });
  });

  // 验证细带 → 打开检查器并切到验证页
  dock.querySelectorAll('[data-open-verify]').forEach((b) => {
    b.addEventListener('click', () => {
      inspTab = 'verify';
      if (!locate(layout, 'inspector')) layout = togglePanel(layout, 'inspector');
      render();
    });
  });

  // 场景搜索
  const si = dock.querySelector('#sceneSearch');
  if (si) {
    si.addEventListener('input', (e) => {
      sceneQuery = e.target.value;
      const pane = dock.querySelector('[data-id="scenes"] .panel-body');
      if (pane) {
        const html = CONTENT.scenes();
        // 只替换列表区，避免输入框失焦
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const newScroll = tmp.querySelector('.side-scroll');
        const newFoot = tmp.querySelector('.side-foot');
        const oldScroll = pane.querySelector('.side-scroll');
        const oldFoot = pane.querySelector('.side-foot');
        if (newScroll && oldScroll) oldScroll.replaceWith(newScroll);
        if (newFoot && oldFoot) oldFoot.replaceWith(newFoot);
        wirePanels();
        const again = dock.querySelector('#sceneSearch');
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }
    });
    si.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.target.value = ''; sceneQuery = ''; render(); }
    });
  }

  // 输入框自动增高
  const ta = dock.querySelector('.composer textarea');
  if (ta) {
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; };
    ta.addEventListener('input', fit);
    fit();
  }
}

// ── 拖拽换栏位 ──
let drag = null;
function startDrag(e) {
  if (e.button !== 0) return;
  const id = e.currentTarget.dataset.drag;
  if (e.target.closest('[data-collapse],[data-close],[data-max],[data-tab]')) return;
  e.preventDefault();
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.textContent = PANELS[id].title;
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  drag = { id, ghost };
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', endDrag, { once: true });
}

function hitTest(x, y) {
  const regions = [...dock.querySelectorAll('.region')].filter((r) => r.dataset.empty !== 'true');
  if (!regions.length) return null;
  let hit = null;
  for (const r of regions) {
    const rect = r.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right) { hit = r; break; }
  }
  if (!hit) {
    let best = Infinity;
    for (const r of regions) {
      const rect = r.getBoundingClientRect();
      const d = x < rect.left ? rect.left - x : x - rect.right;
      if (d < best) { best = d; hit = r; }
    }
  }
  if (!hit) return null;
  const region = hit.dataset.region;
  const panels = [...hit.querySelectorAll('.panel')];
  let index = panels.length;
  let lineY = hit.getBoundingClientRect().bottom - 1;
  for (let i = 0; i < panels.length; i++) {
    const pr = panels[i].getBoundingClientRect();
    if (y < pr.top + pr.height / 2) { index = i; lineY = pr.top; break; }
    lineY = pr.bottom;
  }
  const rect = hit.getBoundingClientRect();
  return { region, index, y: lineY, left: rect.left, width: rect.width };
}

function onDragMove(e) {
  if (!drag) return;
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const t = hitTest(e.clientX, e.clientY);
  drag.target = t;
  paintDrop(t);
}

let dropLine = null;
function paintDrop(t) {
  if (!dropLine) {
    dropLine = document.createElement('div');
    dropLine.className = 'drop-line';
    document.body.appendChild(dropLine);
  }
  if (!t) { dropLine.style.display = 'none'; return; }
  dropLine.style.display = 'block';
  dropLine.style.left = t.left + 'px';
  dropLine.style.width = t.width + 'px';
  dropLine.style.top = (t.y - 1) + 'px';
  dropLine.style.height = '2px';
  dock.querySelectorAll('.region').forEach((r) => r.setAttribute('data-drop', String(r.dataset.region === t.region)));
}

function endDrag() {
  document.removeEventListener('pointermove', onDragMove);
  if (!drag) return;
  const { id, ghost, target } = drag;
  ghost.remove();
  drag = null;
  if (dropLine) dropLine.remove();
  dropLine = null;
  dock.querySelectorAll('.region').forEach((r) => r.setAttribute('data-drop', 'false'));
  if (!target) return;
  let idx = target.index;
  const from = locate(layout, id);
  if (from && from.region === target.region && from.index < target.index) idx -= 1;
  layout = movePanel(layout, id, target.region, idx);
  render();
}

// ── 分栏宽度 ──
let resize = null;
function startResize(e) {
  if (e.button !== 0) return;
  e.preventDefault();
  const i = Number(e.currentTarget.dataset.split);
  const regionEls = [...dock.querySelectorAll('.region')];
  const a = regionEls[i], b = regionEls[i + 1];
  if (!a || !b || a.dataset.empty === 'true' || b.dataset.empty === 'true') return;
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  resize = { a, b, startX: e.clientX, wa: ra.width, wb: rb.width };
  e.currentTarget.setAttribute('data-active', 'true');
  document.addEventListener('pointermove', onResizeMove);
  document.addEventListener('pointerup', endResize, { once: true });
}
function onResizeMove(e) {
  if (!resize) return;
  const dx = e.clientX - resize.startX;
  const ra = resize.a.dataset.region, rb = resize.b.dataset.region;
  let wa = resize.wa + dx, wb = resize.wb - dx;
  if (wa < 160) { wa = 160; wb = resize.wa + resize.wb - 160; }
  if (wb < 160) { wb = 160; wa = resize.wa + resize.wb - 160; }
  if (ra !== 'center') { resize.a.style.flex = `0 0 ${wa}px`; layout.sizes[ra] = Math.round(wa); }
  if (rb !== 'center') { resize.b.style.flex = `0 0 ${wb}px`; layout.sizes[rb] = Math.round(wb); }
}
function endResize() {
  document.removeEventListener('pointermove', onResizeMove);
  resize = null;
  dock.querySelectorAll('.splitter').forEach((s) => s.removeAttribute('data-active'));
  persist();
}

// ── 区域内纵向 ──
let resizeH = null;
function startResizeH(e) {
  if (e.button !== 0) return;
  e.preventDefault();
  const [r, iStr] = e.currentTarget.dataset.hsplit.split(':');
  const i = Number(iStr);
  const ids = layout.regions[r];
  const aId = ids[i], bId = ids[i + 1];
  if (!aId || !bId) return;
  const ea = dock.querySelector(`.panel[data-id="${aId}"]`);
  const eb = dock.querySelector(`.panel[data-id="${bId}"]`);
  if (!ea || !eb) return;
  const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
  resizeH = { ea, eb, aId, bId, startY: e.clientY, ha: ra.height, hb: rb.height };
  e.currentTarget.setAttribute('data-active', 'true');
  document.addEventListener('pointermove', onResizeHMove);
  document.addEventListener('pointerup', endResizeH, { once: true });
}
function onResizeHMove(e) {
  if (!resizeH) return;
  const dy = e.clientY - resizeH.startY;
  const total = resizeH.ha + resizeH.hb;
  let ha = resizeH.ha + dy, hb = total - ha;
  if (ha < 56) { ha = 56; hb = total - 56; }
  if (hb < 56) { hb = 56; ha = total - 56; }
  resizeH.ea.style.flex = `${ha} 1 0px`;
  resizeH.eb.style.flex = `${hb} 1 0px`;
}
function endResizeH() {
  document.removeEventListener('pointermove', onResizeHMove);
  if (!resizeH) return;
  const { ea, eb, aId, bId } = resizeH;
  const ha = ea.getBoundingClientRect().height;
  const hb = eb.getBoundingClientRect().height;
  const total = ha + hb || 1;
  const scale = weightOf(aId) + weightOf(bId);
  layout.weights[aId] = Math.max(0.2, Math.round((ha / total) * scale * 100) / 100);
  layout.weights[bId] = Math.max(0.2, Math.round((hb / total) * scale * 100) / 100);
  resizeH = null;
  dock.querySelectorAll('.split-h').forEach((s) => s.removeAttribute('data-active'));
  persist();
  render();
}

const palette = document.getElementById('palette');

function focusPanel(id) {

function buildCommands() {

    { kind: '布局', label: '只看会话（收起两侧）', where: '专注', run: () => {

    { kind: '检查器', label: '上下文', where: 'tab', run: () => { inspTab = 'context'; focusPanel('inspector'); } },
    { kind: '检查器', label: '验证', where: 'tab', run: () => { inspTab = 'verify'; focusPanel('inspector'); } },
    { kind: '检查器', label: '变更', where: 'tab', run: () => { inspTab = 'changes'; focusPanel('inspector'); } },
  ];
  for (const id of Object.keys(PANELS)) {
    const on = !!locate(layout, id);
    cmds.push({
      kind: '面板',
      label: (on ? '关闭：' : '打开：') + PANELS[id].title,
      where: on ? '已开' : '未开',
      run: () => { layout = togglePanel(layout, id); render(); },
    });
  }
  return cmds;
}

function buildPalette(query = '') {
  const q = query.trim().toLowerCase();
  palCur = buildCommands();
  const hits = palCur.filter((c) => !q || (c.label + c.kind + c.where).toLowerCase().includes(q));
  pList.innerHTML = hits.map((c) =>
    `<div class="pal-item" data-cmd="${palCur.indexOf(c)}" aria-selected="${hits.indexOf(c) === 0}">
      <span class="kind">${esc(c.kind)}</span><span class="lbl">${esc(c.label)}</span><span class="where">${esc(c.where)}</span>
    </div>`).join('');
  pList.querySelectorAll('.pal-item').forEach((el) => {
    el.addEventListener('click', () => runCmd(Number(el.dataset.cmd)));
  });
  return hits;
}

function runCmd(i) {
  const c = palCur[i];
  if (!c) return;
  openPalette(false);
  c.run?.();
}

let palCursor = 0;
function openPalette(open) {
  palette.dataset.open = open ? 'true' : 'false';
  if (open) { pInput.value = ''; buildPalette(''); palCursor = 0; pInput.focus(); }
}

document.addEventListener('keydown', (e) => {
  const open = palette.dataset.open === 'true';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(!open); return; }
  if (!open) {
    if (e.key === 'Escape' && layout.maximized) {
      e.preventDefault();
      layout = toggleMax(layout, layout.maximized);
      render();
    }
    return;
  }
  const items = [...pList.querySelectorAll('.pal-item')];
  if (e.key === 'Escape') { e.preventDefault(); openPalette(false); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    palCursor = (palCursor + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.setAttribute('aria-selected', String(i === palCursor)));
    items[palCursor].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const el = items[palCursor];
    if (el) runCmd(Number(el.dataset.cmd));
  }
});
palette.addEventListener('click', (e) => { if (e.target === palette) openPalette(false); });
pInput.addEventListener('input', (e) => { buildPalette(e.target.value); palCursor = 0; });

document.getElementById('tbLayout').addEventListener('click', () => openPalette(true));

// ══════════════════════════════════════════════════════════════════════
//  8. 外观：明暗与密度（持久化）
// ══════════════════════════════════════════════════════════════════════
const root = document.documentElement;
const tTheme = document.getElementById('tTheme');
const tDensity = document.getElementById('tDensity');
const densities = ['normal', 'compact', 'cozy'];
const densityLabel = { normal: '标准', compact: '紧凑', cozy: '宽松' };

function saveAppearance() {
  localStorage.setItem('workbench.theme', root.dataset.theme || 'dark');
  localStorage.setItem('workbench.density', root.dataset.density || 'normal');
}
function restoreAppearance() {
  const theme = localStorage.getItem('workbench.theme');
  const density = localStorage.getItem('workbench.density');
  if (theme === 'light' || theme === 'dark') {
    root.dataset.theme = theme;
    tTheme.textContent = theme === 'light' ? '亮' : '暗';
    tTheme.setAttribute('aria-pressed', String(theme === 'light'));
  }
  if (densities.includes(density)) {
    root.dataset.density = density;
    tDensity.textContent = densityLabel[density];
    tDensity.setAttribute('aria-pressed', String(density !== 'normal'));
  }
}
tTheme.addEventListener('click', () => {
  const dark = root.dataset.theme !== 'light';
  root.dataset.theme = dark ? 'light' : 'dark';
  tTheme.textContent = dark ? '亮' : '暗';
  tTheme.setAttribute('aria-pressed', String(dark));
  saveAppearance();
});
tDensity.addEventListener('click', () => {
  const i = densities.indexOf(root.dataset.density || 'normal');
  const next = densities[(i + 1) % densities.length];
  root.dataset.density = next;
  tDensity.textContent = densityLabel[next];
  tDensity.setAttribute('aria-pressed', String(next !== 'normal'));
  saveAppearance();
});

// ══════════════════════════════════════════════════════════════════════
//  9. 自检
// ══════════════════════════════════════════════════════════════════════
function selfTest() {
  const results = [];
  const t = (name, fn) => {
    try { const v = fn(); results.push({ name, ok: v === true, detail: v === true ? '' : String(v) }); }
    catch (e) { results.push({ name, ok: false, detail: '抛异常: ' + e.message }); }
  };

  const L0 = cloneLayout(DEFAULT_LAYOUT);
  const L4 = togglePanel(L0, 'fleet');   // 打开可选的舰队，得到左栏两个面板

  t('默认布局 3 个面板（每栏一个）', () => panelCount(L0) === 3);
  t('默认三栏分别是 scenes / chat / inspector', () =>
    L0.regions.left.join() === 'scenes' && L0.regions.center.join() === 'chat' && L0.regions.right.join() === 'inspector');

  t('打开可选的舰队 → 4 个面板且落在左栏', () => {
    const w = locate(L4, 'fleet');
    return w && w.region === 'left' && panelCount(L4) === 4;
  });

  t('跨栏移动：把 scenes 移到右栏末尾', () => {
    const L = movePanel(L0, 'scenes', 'right', 99);
    const w = locate(L, 'scenes');
    return w.region === 'right' && w.index === L.regions.right.length - 1 && panelCount(L) === 3;
  });

  t('同栏内往后移：顺序正确且不丢面板', () => {
    const L = movePanel(L4, 'scenes', 'left', 1);
    return L.regions.left.join() === 'fleet,scenes' && panelCount(L) === 4;
  });

  t('同栏内往前移：顺序正确', () => {
    const L1 = movePanel(L4, 'scenes', 'left', 1);
    const L2 = movePanel(L1, 'scenes', 'left', 0);
    return L2.regions.left.join() === 'scenes,fleet';
  });

  t('移动是纯函数：不修改入参', () => {
    const snapshot = serialize(L4);
    movePanel(L4, 'inspector', 'center', 0);
    return serialize(L4) === snapshot;
  });

  t('index 越界被夹住，不抛错', () => {
    const a = movePanel(L4, 'fleet', 'center', -5);
    const b = movePanel(L4, 'fleet', 'center', 9999);
    return locate(a, 'fleet').index === 0 && locate(b, 'fleet').index === b.regions.center.length - 1;
  });

  t('未知面板会抛错（不静默吞掉）', () => {
    try { movePanel(L0, 'nope', 'left', 0); return false; } catch { return true; }
  });

  t('未知区域会抛错', () => {
    try { movePanel(L0, 'scenes', 'top', 0); return false; } catch { return true; }
  });

  t('序列化 → 反序列化 往返一致', () => {
    const L = movePanel(L4, 'fleet', 'right', 0);
    return serialize(deserialize(serialize(L))) === serialize(L);
  });

  t('旧存档里的废面板会被丢掉，但不会丢新面板', () => {
    const bad = JSON.stringify({ regions: { left: ['gone', 'scenes'], center: ['chat'], right: [] }, sizes: {}, collapsed: {} });
    const L = deserialize(bad);
    return !allPanelIds(L).includes('gone') && panelCount(L) === 3 && L.regions.center.includes('chat');
  });

  t('坏存档不崩：非法 JSON 回落到默认布局', () => {
    const L = deserialize('{这不是 JSON');
    return panelCount(L) === 3 && L.regions.center.includes('chat');
  });

  t('展开/收起不影响布局结构', () => {
    const L = cloneLayout(L0);
    L.collapsed.chat = true;
    const back = deserialize(serialize(L));
    return back.collapsed.chat === true && back.regions.center.includes('chat');
  });

  t('每个面板在任何布局里都只出现一次（无复制）', () => {
    let L = cloneLayout(L0);
    for (const id of allPanelIds(L0)) L = movePanel(L, id, 'center', 0);
    const ids = allPanelIds(L);
    return ids.length === 3 && new Set(ids).size === 3;
  });

  t('optional 面板不会被存档自动复活', () => {
    const L = deserialize(serialize(cloneLayout(DEFAULT_LAYOUT)));
    return !allPanelIds(L).includes('files') && panelCount(L) === 3;
  });

  t('optional 面板可以被显式加入布局', () => {
    const L = movePanel(cloneLayout(DEFAULT_LAYOUT), 'files', 'right', 99);
    return allPanelIds(L).includes('files') && panelCount(L) === 4;
  });

  t('每个面板的权重都是有效正数或无设置', () => {
    const L = cloneLayout(DEFAULT_LAYOUT);
    return Object.keys(PANELS).every((id) => {
      const w = L.weights[id];
      return w === undefined || (typeof w === 'number' && Number.isFinite(w) && w > 0);
    });
  });

  t('双击最大化：设置后再双击还原', () => {
    const on = toggleMax(L0, 'chat');
    const off = toggleMax(on, 'chat');
    return on.maximized === 'chat' && off.maximized === null;
  });

  t('最大化是纯函数：不修改入参', () => {
    const L = cloneLayout(L0);
    const snapshot = serialize(L);
    toggleMax(L, 'chat');
    return serialize(L) === snapshot;
  });

  t('closable:false 的面板关不掉（会话面板必须一直在）', () => {
    const L = togglePanel(cloneLayout(L0), 'chat');
    return !!locate(L, 'chat') && panelCount(L) === 3;
  });

  t('关掉正在最大化的面板会同时清掉最大化（否则整屏空白）', () => {
    let L = togglePanel(cloneLayout(L0), 'files');
    L = toggleMax(L, 'files');
    L = togglePanel(L, 'files');
    return L.maximized === null;
  });

  t('存档带权重与最大化，往返不丢', () => {
    const L = cloneLayout(DEFAULT_LAYOUT);
    L.weights.chat = 2.5;
    const on = toggleMax(L, 'scenes');
    const back = deserialize(serialize(on));
    return back.weights.chat === 2.5 && back.maximized === 'scenes';
  });

  t('存档里指向不存在的最大化 id 会被丢掉', () => {
    const raw = JSON.stringify({ regions: DEFAULT_LAYOUT.regions, sizes: DEFAULT_LAYOUT.sizes, collapsed: {}, weights: {}, maximized: 'ghost' });
    return deserialize(raw).maximized === null;
  });

  t('关掉再打开同一个面板不会产生副本', () => {
    let L = togglePanel(cloneLayout(L0), 'inspector');
    L = togglePanel(L, 'inspector');
    return allPanelIds(L).filter((x) => x === 'inspector').length === 1;
  });

  t('场景搜索：空查询返回全部', () => {
    return SCENES.every((s) => matchScene(s, '') && matchScene(s, '   '));
  });

  t('场景搜索：按名字过滤', () => {
    const hits = SCENES.filter((s) => matchScene(s, '工坊'));
    return hits.length === 3 && hits.every((s) => s.nm.includes('工坊'));
  });

  t('场景搜索：无匹配时返回空（不是返回全部）', () => {
    return SCENES.filter((s) => matchScene(s, 'zzzz')).length === 0;
  });

  t('检查器标签页是 UI 状态，不进布局模型', () => {
    const before = serialize(layout);
    inspTab = 'verify';
    const same = serialize(layout) === before;
    inspTab = 'context';
    return same;
  });

  const bad = results.filter((r) => !r.ok);
  const out = [
    '  布局自检  ' + (results.length - bad.length) + '/' + results.length + ' 成立',
    ...results.map((r) => '  ' + (r.ok ? '✓' : '✗') + ' ' + r.name + (r.detail ? '   ← ' + r.detail : '')),
    '  结论: ' + (bad.length ? '✗ ' + bad.length + ' 项不成立' : '✓ 全部成立'),
  ].join('\n');
  return { text: out, ok: bad.length === 0, pass: results.length - bad.length, total: results.length };
}

// ── 启动 ──
restoreAppearance();
render();

const params = new URLSearchParams(location.search);
if (params.get('selftest') === '1') {
  const r = selfTest();
  const el = document.getElementById('selftest');
  el.textContent = 'SELFTEST_BEGIN\n' + r.text + '\nSELFTEST_END\nRESULT ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
  el.style.display = 'block';
  document.title = 'SELFTEST ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
}
window.__selfTest = selfTest;
</script>
