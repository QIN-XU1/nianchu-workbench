<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench v4</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  v4：不再手搓组件，直接复用现成的
  ──────────────────────────────────────────────────────────────────────
  多项目对比结论（源码级，见 research/界面复用对比.md）：

    项目              设计体系
    Cherry Studio     Tailwind v4 + shadcn 约定 + Lucide 图标
    LibreChat         Tailwind（自研组件）
    Open WebUI        Tailwind v4 + typography
    LobeChat          @lobehub/ui（自研 UI 包）+ emotion
    AionUi            Arco Design（五家里唯一用完整组件库的）

  四家都在 Tailwind 上手搓组件 —— 而我手搓的结果就是「廉价」。
  所以 v4 选 AionUi 那条路：Arco Design 的成品组件 CSS（vendor/arco.css，657KB），
  加 Lucide 图标（vendor/lucide.js，Cherry Studio 也用它）。
  我只写两样东西：信息架构（v3 已验证）+ 一层配色覆盖。

  复用清单与许可：
    Arco Design  @arco-design/web-react 2.66.1  MIT
    Lucide       lucide 0.469.0                 ISC
  ══════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="vendor/arco.css">
<style>
/* ── 覆盖层：只改配色与圆角，组件结构一律用 Arco 的 ──
   中性灰阶 + 单一主色（蓝）沿用我们"颜色只表示状态"的原则。 */
:root {
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  --sider-w: 248px;
  --topbar-h: 52px;
  --density-scale: 1;
}
body[arco-theme='dark'] {
  --color-bg-1: #0e0e10;
  --color-bg-2: #141416;
  --color-bg-3: #1a1a1d;
  --color-bg-4: #212125;
  --color-bg-5: #29292e;
  --color-bg-white: #17171a;
  --color-menu-dark-bg: #141416;
  --color-border: #26262b;
  --color-border-2: #303036;
  --color-border-3: #3a3a41;
  --color-border-4: #45454d;
  --color-text-1: #f2f2f4;
  --color-text-2: #b6bac2;
  --color-text-3: #8b9099;
  --color-text-4: #6b7079;
  --color-fill-1: #17171a;
  --color-fill-2: #1f1f23;
  --color-fill-3: #26262b;
  --color-fill-4: #2e2e34;
  --primary-1: #10131c;
  --primary-2: #16203a;
  --primary-3: #1d2d57;
  --primary-5: #3a63cc;
  --primary-6: #4f7cff;
  --primary-7: #6b90ff;
  --border-radius-small: 4px;
  --border-radius-medium: 6px;
  --border-radius-large: 8px;
  /* 验证四态：颜色只表示状态 */
  --st-pass: #3fbf8f;
  --st-warn: #e0a33c;
  --st-fail: #f06a6d;
  --st-unknown: #9aa3b0;
}
html[data-theme='light'] body { /* 亮色由 Arco 自带浅色主题兜底，这里只把底色调白 */ }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  overflow: hidden;
  background: var(--color-bg-1);
  color: var(--color-text-1);
}
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--color-border-3); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }

/* ── Arco 开关：小号类名是 arco-switch-small；开状态必须显式给色，
   否则暗色下 checked 的轨道几乎看不见（本轮实测踩到） ── */
.arco-switch { background: var(--color-fill-4); }
.arco-switch.arco-switch-checked { background: var(--primary-6); }
.arco-switch .arco-switch-dot { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.arco-switch-small { width: 28px; height: 16px; }
.arco-switch-small .arco-switch-dot { width: 12px; height: 12px; }

/* ── 骨架 ── */
.app { display: flex; height: 100vh; }
.sider {
  width: var(--sider-w); flex: none; display: flex; flex-direction: column;
  background: var(--color-bg-2); border-right: 1px solid var(--color-border);
  min-height: 0;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--color-bg-1); }

/* ── 侧栏 ── */
.sider-top { padding: 10px 10px 6px; flex: none; }
.workspace {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px; border-radius: 6px; border: 0; background: none; text-align: left; cursor: pointer;
  transition: background .12s ease;
}
.workspace:hover { background: var(--color-fill-2); }
.workspace .meta { min-width: 0; }
.workspace .nm { display: block; font-size: 13px; font-weight: 600; color: var(--color-text-1); }
.workspace .sub { display: block; font-size: 11px; color: var(--color-text-3); font-family: var(--font-mono); }
.workspace .chev { margin-left: auto; color: var(--color-text-3); }

.search-wrap { padding: 6px 10px 8px; flex: none; }
.search-wrap .arco-input-inner-wrapper { background: var(--color-fill-2); border-color: transparent; }
.search-wrap .arco-input-inner-wrapper:hover { background: var(--color-fill-3); }
.search-wrap .arco-input-inner-wrapper:focus-within { border-color: var(--primary-6); background: var(--color-bg-3); }

.nav { padding: 2px 8px 6px; flex: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px;
  padding: 0 10px; border-radius: 6px; border: 0; background: none;
  font-size: 13px; color: var(--color-text-2); cursor: pointer; text-align: left;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--color-fill-2); color: var(--color-text-1); }
.nav-item[aria-current='true'] { background: var(--color-fill-3); color: var(--color-text-1); font-weight: 600; }
.nav-item .ico { flex: none; color: var(--color-text-3); display: grid; place-items: center; }
.nav-item[aria-current='true'] .ico { color: var(--primary-6); }
.nav-item .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-4); }

.list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
.grp {
  display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--color-text-4);
}
.grp .n { font-family: var(--font-mono); letter-spacing: 0; font-weight: 400; }
.row {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; border-radius: 6px; border: 0; background: none;
  text-align: left; cursor: pointer; font-size: 13px; color: var(--color-text-2);
  transition: background .12s ease;
}
.row:hover { background: var(--color-fill-2); }
.row[aria-selected='true'] { background: var(--color-fill-3); color: var(--color-text-1); font-weight: 600; }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tail { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-4); flex: none; }
.row .tail.run { color: var(--st-warn); }

.sider-foot {
  flex: none; border-top: 1px solid var(--color-border); padding: 8px;
  display: flex; align-items: center; gap: 4px;
}
.icon-btn {
  width: 30px; height: 30px; border-radius: 6px; border: 0; background: none;
  display: grid; place-items: center; color: var(--color-text-3); cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.icon-btn:hover { background: var(--color-fill-2); color: var(--color-text-1); }
.sider-foot .spacer { flex: 1; }

/* ── 顶栏 ── */
.topbar {
  height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 20px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-1);
}
.topbar .title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.topbar .crumb { font-size: 12px; color: var(--color-text-3); }
.topbar .spacer { flex: 1; }

/* ── 内容区 ── */
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* 会话 */
.conv { flex: 1; min-height: 0; display: flex; }
.conv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 0 12px; }
.chat-inner { max-width: 760px; margin: 0 auto; padding: 0 24px; }
.turn { margin-bottom: 24px; }
.turn + .turn { margin-top: 24px; }
.who { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.who .name { font-size: 12px; font-weight: 600; color: var(--color-text-2); }
.who .ts { font-size: 11px; color: var(--color-text-4); font-family: var(--font-mono); }
.turn.user .who { justify-content: flex-end; }
.user-msg {
  background: var(--color-fill-2); border: 1px solid var(--color-border);
  border-radius: 10px; padding: 10px 14px; max-width: 82%; margin-left: auto; width: fit-content;
  font-size: 14px; line-height: 1.65;
}
.prose { font-size: 14px; line-height: 1.8; }
.prose p { margin: 0 0 12px; }
.prose p:last-child { margin-bottom: 0; }
.prose code { font-family: var(--font-mono); font-size: 12.5px; background: var(--color-fill-2); padding: 1px 5px; border-radius: 4px; }
.prose b { font-weight: 600; }

/* 工具调用卡：用 Arco 的 Card 外观，只加自己的 diff 行 */
.tool { margin: 10px 0; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-bg-2); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; }
.tool-head .tn { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-text-1); }
.tool-head .arg { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-head .spacer { flex: 1; }
.tool-head .dur { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-4); }
.tool-body {
  border-top: 1px solid var(--color-border); background: #0b0b0d;
  padding: 10px 12px; font-family: var(--font-mono); font-size: 11px; line-height: 1.7;
  color: var(--color-text-2); overflow-x: auto;
}
.tool-body .add { display: block; background: rgba(63,191,143,.10); }
.tool-body .del { display: block; background: rgba(240,106,109,.10); }
.tool-body .ln { display: inline-block; width: 2.2em; color: var(--color-text-4); user-select: none; }

.turn-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px;
  padding-top: 8px; border-top: 1px solid var(--color-border);
  font-family: var(--font-mono); font-size: 11px; color: var(--color-text-4);
}
.turn-meta .k { color: var(--color-text-3); }

/* 状态点 */
.dot { width: 7px; height: 7px; border-radius: 999px; flex: none; display: inline-block; }
.dot.pass { background: var(--st-pass); }
.dot.warn { background: var(--st-warn); }
.dot.fail { background: var(--st-fail); }
.dot.unknown { background: var(--st-unknown); }

/* 验证带 */
.verify-bar {
  flex: none; height: 38px; border-top: 1px solid var(--color-border);
  display: flex; align-items: center; gap: 6px; padding: 0 24px;
}
.verify-bar .label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-4); margin-right: 4px; }
.verify-bar .spacer { flex: 1; }
.vchip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border-radius: 5px; border: 1px solid transparent; background: none; cursor: pointer;
  font-size: 12px; color: var(--color-text-2); transition: background .12s ease, border-color .12s ease;
}
.vchip:hover { background: var(--color-fill-2); border-color: var(--color-border); }
.vchip .n { font-family: var(--font-mono); font-weight: 600; }
.vchip.dim { opacity: .45; }

/* 输入区 */
.composer-wrap { flex: none; padding: 0 24px 16px; }
.composer {
  max-width: 760px; margin: 0 auto; border: 1px solid var(--color-border-2);
  border-radius: 10px; background: var(--color-bg-2);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.composer:focus-within { border-color: var(--primary-6); box-shadow: 0 0 0 3px rgba(79,124,255,.14); }
.composer textarea {
  width: 100%; resize: none; border: 0; background: none; color: var(--color-text-1);
  font: inherit; font-size: 14px; padding: 12px 14px 6px; min-height: 46px; max-height: 180px;
  outline: none; display: block;
}
.composer textarea::placeholder { color: var(--color-text-4); }
.composer-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px; }
.composer-bar .spacer { flex: 1; }
.cap-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border-radius: 5px; border: 1px solid var(--color-border); background: none; cursor: pointer;
  font-size: 11px; color: var(--color-text-3); font-family: var(--font-mono);
  transition: border-color .12s ease, color .12s ease;
}
.cap-pill:hover { border-color: var(--color-border-3); color: var(--color-text-1); }

/* 右工作区 */
.work { width: 320px; flex: none; border-left: 1px solid var(--color-border); display: flex; flex-direction: column; background: var(--color-bg-2); min-height: 0; }
.work-tabs { flex: none; padding: 8px 8px 0; border-bottom: 1px solid var(--color-border); }
.work-tabs .arco-tabs-header-nav::before { display: none; }
.work-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
.kv { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; border-radius: 4px; }
.kv:hover { background: var(--color-fill-2); }
.kv .k { font-size: 12px; color: var(--color-text-2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .v { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-3); flex: none; }
.sec-h { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-4); margin: 14px 0 6px; }
.sec-h:first-child { margin-top: 0; }

/* 验证行 */
.vrow { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 8px 6px; border-radius: 6px; font-size: 12px; }
.vrow:hover { background: var(--color-fill-2); }
.vrow + .vrow { border-top: 1px solid var(--color-border); }
.vrow .what { grid-column: 2; color: var(--color-text-2); }
.vrow .ev { grid-column: 2; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-4); }

/* 能力页 */
.cap { flex: 1; min-height: 0; display: flex; }
.cap-nav { width: 176px; flex: none; border-right: 1px solid var(--color-border); padding: 12px 8px; background: var(--color-bg-2); }
.cap-nav .h { padding: 0 8px 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-4); }
.cap-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px;
  border-radius: 6px; border: 0; background: none; cursor: pointer; text-align: left;
  font-size: 13px; color: var(--color-text-2); transition: background .12s ease, color .12s ease;
}
.cap-item:hover { background: var(--color-fill-2); color: var(--color-text-1); }
.cap-item[aria-current='true'] { background: var(--color-fill-3); color: var(--color-text-1); font-weight: 600; }
.cap-item .ico { color: var(--color-text-3); display: grid; place-items: center; }
.cap-item[aria-current='true'] .ico { color: var(--primary-6); }
.cap-item .n { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-4); }
.cap-main { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px; }
.cap-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
.cap-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.cap-head .n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-4); }
.cap-head .spacer { flex: 1; }
.cap-desc { font-size: 13px; color: var(--color-text-3); margin: 4px 0 16px; }
.cap-tbl-wrap { max-width: 1040px; }

/* Arco 表格微调：第一列两行 */
.cap-tbl .arco-table-td, .cap-tbl .arco-table-th { padding: 9px 12px; }
.cap-tbl .c1 { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.cap-tbl .c1 .dot { margin-top: 7px; }
.cap-tbl .c1 .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cap-tbl .c1 .nm { font-size: 13px; font-weight: 600; color: var(--color-text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap-tbl .c1 .dsc { font-size: 12px; color: var(--color-text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap-tbl .arco-table-th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-4); font-weight: 600; }

/* 智能体详情 */
.doc { max-width: 760px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--color-border); font-size: 13px; }
.doc-row:first-of-type { border-top: 0; }
.doc-row .k { color: var(--color-text-2); flex: 1; }
.doc-row .v { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-3); }

/* 设置 */
.set { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
.set-inner { max-width: 720px; }
.set-sec { margin-bottom: 24px; }
.set-sec h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.set-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--color-border); }
.set-row .k { font-size: 13px; color: var(--color-text-2); }
.set-row .d { font-size: 11px; color: var(--color-text-4); }
.set-row .spacer { flex: 1; }

/* 空态：用 Arco 的 Empty */
.empty-wrap { padding: 48px; display: grid; place-items: center; }

@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }
</style>
</head>
<body arco-theme="dark">
<div class="app">
  <aside class="sider">
    <div class="sider-top">
      <button class="workspace">
        <span class="arco-avatar arco-avatar-circle" style="width:28px;height:28px;line-height:28px;font-size:12px;background:var(--color-fill-3)">架</span>
        <span class="meta">
          <span class="nm">架构梳理</span>
          <span class="sub">local-9f32…47875</span>
        </span>
        <span class="chev" data-lucide="chevrons-up-down" style="width:14px;height:14px"></span>
      </button>
    </div>
    <div class="search-wrap">
      <div class="arco-input-inner-wrapper" style="height:30px">
        <span class="arco-input-group-prefix" style="padding-left:8px"><span data-lucide="search" style="width:13px;height:13px"></span></span>
        <input id="globalSearch" class="arco-input" placeholder="搜索会话、能力、工具" style="font-size:12px">
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="list-scroll" id="listScroll"></div>

      <button class="icon-btn" id="btnDensity" title="信息密度"><span data-lucide="rows-3" style="width:15px;height:15px"></span></button>

</div>

      <div class="arco-input-inner-wrapper" style="height:40px">

        <input id="paletteInput" class="arco-input" placeholder="跳到会话、能力、工具或命令…" style="font-size:15px">
      </div>

</div>

  const kind = CAP_KINDS.find((c) => c.id === capKind) || CAP_KINDS[0];
  const list = capItems(kind.id);
  return `<div class="cap">
    <div class="cap-main">
      <div class="cap-head"><h2>${esc(kind.label)}</h2><span class="n">${list.length}</span></div>
      <div class="cap-desc">${esc(kind.desc)}</div>
      ${list.length ? capTableHTML(kind.id, list) : `<div class="empty-wrap"><div class="arco-empty"><div class="arco-empty-image">${ICON('inbox', 40)}</div><div class="arco-empty-description">还没有配置</div></div></div>`}
    </div></div>`;
}

function agentsHTML() {
  const a = AGENTS.find((x) => x.id === route.item) || AGENTS[0];
  return `<div class="cap"><div class="cap-main"><div class="doc">
    <div class="cap-head"><h2>${esc(a.nm)}</h2><span class="n">${esc(a.model)}</span></div>
    <div class="cap-desc">智能体 = 模型 + 技能 + MCP + 工具权限。三者在「能力」里配置，这里只做组合。</div>
    <div class="sec-h">已启用技能 ${a.skills}</div>
    ${SKILLS.slice(0, a.skills).map((s) => `<div class="doc-row"><span class="dot pass"></span><span class="k">${esc(s.nm)}</span><span class="v">${esc(s.src)}</span></div>`).join('')}
    <div class="sec-h">已连接 MCP ${a.mcp}</div>
    ${MCP.slice(0, a.mcp).map((m) => `<div class="doc-row"><span class="dot ${m.st}"></span><span class="k">${esc(m.nm)}</span><span class="v">${m.tools} 工具</span></div>`).join('')}
    <div class="sec-h">工具权限</div>
    ${TOOLS.map((t) => `<div class="doc-row"><span class="dot ${t.st}"></span><span class="k">${esc(t.nm)} · ${esc(t.desc)}</span><span class="v">${esc(t.perm)}</span></div>`).join('')}
  </div></div></div>`;
}

function automationHTML() {
  return `<div class="cap"><div class="cap-main">
    <div class="cap-head"><h2>自动化</h2><span class="n">${CRON.length}</span></div>
    <div class="cap-desc">定时把任务派给智能体；跑完写回派单台账。</div>
    <div class="doc" style="max-width:820px">
      ${CRON.map((k) => `<div class="doc-row"><span class="dot ${k.on ? 'pass' : 'unknown'}"></span>
        <span class="k">${esc(k.nm)}</span><span class="v">${esc(k.when)}</span>
        <button class="arco-switch arco-switch-small ${k.on ? 'arco-switch-checked' : ''}" role="switch" aria-checked="${k.on}"><span class="arco-switch-dot"></span></button></div>`).join('')}
    </div></div></div>`;
}

function settingsHTML() {
  return `<div class="set"><div class="set-inner">
    <div class="set-sec"><h2>外观</h2>
      <div class="set-row"><span class="k">主题</span><span class="spacer"></span><button class="arco-btn arco-btn-secondary arco-btn-size-small" id="sTheme">跟随系统</button></div>
      <div class="set-row"><span class="k">信息密度</span><span class="d">只缩放间距，不改字号</span><span class="spacer"></span><button class="arco-btn arco-btn-secondary arco-btn-size-small" id="sDensity">标准</button></div>
    </div>
    <div class="set-sec"><h2>模型网关</h2>
      <div class="set-row"><span class="k">本地网关</span><span class="d mono">http://127.0.0.1:3425/v1</span><span class="spacer"></span><span class="dot pass"></span></div>
      <div class="set-row"><span class="k">默认模型</span><span class="spacer"></span><span class="mono" style="font-size:12px;color:var(--color-text-3)">mimo-v2.6-flash</span></div>
    </div>
    <div class="set-sec"><h2>关于</h2>
      <div class="set-row"><span class="k">组件库</span><span class="d">Arco Design 2.66.1 (MIT) · Lucide 0.469.0 (ISC)</span><span class="spacer"></span></div>
      <div class="set-row"><span class="k">版本</span><span class="spacer"></span><span class="mono" style="font-size:12px;color:var(--color-text-3)">v4.0.0</span></div>
      <div class="set-row"><span class="k">验收</span><span class="d">路由 18 断言 · 六套验收器</span><span class="spacer"></span><span class="dot pass"></span></div>
    </div>
  </div></div>`;
}

function icons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
}

function render() {
  $nav.innerHTML = navHTML();
  $list.innerHTML = listHTML();
  $top.innerHTML = topbarHTML();
  $content.innerHTML = route.view === 'capabilities' ? capabilitiesHTML()
    : route.view === 'agents' ? agentsHTML()
    : route.view === 'automation' ? automationHTML()
    : route.view === 'settings' ? settingsHTML()
    : conversationHTML();
  icons();
  wire();
  localStorage.setItem('workbench.route', routeKey(route));
}
function go(r) { route = r; render(); }

// ══════════════════════════════════════════════════════════════════════
//  5. 交互
// ══════════════════════════════════════════════════════════════════════
function wire() {
  $nav.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.nav;
    if (id === 'capabilities') go(makeRoute('capabilities', { section: 'capabilities', item: capKind }));
    else if (id === 'conversation') go(makeRoute('conversation', { section: 'conversation', item: CONVERSATIONS[0].id }));
    else if (id === 'agents') go(makeRoute('agents', { section: 'agents', item: AGENTS[0].id }));
    else go(makeRoute('automation', { section: 'automation' }));
  }));
  document.querySelectorAll('[data-conv]').forEach((b) => b.addEventListener('click', () => go(makeRoute('conversation', { section: 'conversation', item: b.dataset.conv }))));
  document.querySelectorAll('[data-cap]').forEach((b) => b.addEventListener('click', () => { capKind = b.dataset.cap; go(makeRoute('capabilities', { section: 'capabilities', item: capKind })); }));
  document.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => go(makeRoute('agents', { section: 'agents', item: b.dataset.agent }))));
  document.querySelectorAll('[data-wtab]').forEach((b) => b.addEventListener('click', () => { workTab = b.dataset.wtab; render(); }));
  document.querySelectorAll('[data-vtab]').forEach((b) => b.addEventListener('click', () => { workTab = 'verify'; render(); }));
  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => {
    const [kind, id] = b.dataset.toggle.split(':');
    const it = capItems(kind).find((x) => x.id === id);
    if (it) { it.on = !it.on; render(); }
  }));
  document.querySelectorAll('[data-open-caps]').forEach((b) => b.addEventListener('click', () => go(makeRoute('capabilities', { section: 'capabilities', item: 'skills' }))));
  const ta = $content.querySelector('.composer textarea');
  if (ta) {
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; };
    ta.addEventListener('input', fit); fit();
  }
  const sT = document.getElementById('sTheme'); if (sT) sT.addEventListener('click', () => document.getElementById('btnTheme').click());
  const sD = document.getElementById('sDensity'); if (sD) sD.addEventListener('click', () => document.getElementById('btnDensity').click());
}

// 命令面板
const mask = document.getElementById('paletteMask');
const pIn = document.getElementById('paletteInput');
const pList = document.getElementById('paletteList');
let palCur = [];
function buildCommands() {
  const cmds = [
    { kind: '会话', label: '接口审批链路加固', where: '架构梳理', run: () => go(makeRoute('conversation', { section: 'conversation', item: 'c1' })) },
    ...CAP_KINDS.map((c) => ({ kind: '能力', label: c.label, where: c.id, run: () => { capKind = c.id; go(makeRoute('capabilities', { section: 'capabilities', item: c.id })); } })),
    { kind: '页面', label: '设置', where: '⚙', run: () => go(makeRoute('settings', { section: 'settings' })) },
  ];
  for (const it of searchAll(query)) cmds.push({ kind: it.kind, label: it.nm, where: it.where, run: () => {} });
  return cmds;
}
function buildPalette(q) {
  palCur = buildCommands();
  const needle = q.trim().toLowerCase();
  const hits = palCur.filter((c) => !needle || (c.label + c.kind + c.where).toLowerCase().includes(needle));
  pList.innerHTML = hits.map((c) => `<div class="pal-item arco-dropdown-menu-item" data-cmd="${palCur.indexOf(c)}" style="cursor:pointer;padding:9px 10px;border-radius:6px">
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--color-text-4);width:52px;display:inline-block">${esc(c.kind)}</span>
    <span style="font-size:13px;color:var(--color-text-1)">${esc(c.label)}</span>
    <span style="float:right;font-family:var(--font-mono);font-size:11px;color:var(--color-text-4)">${esc(c.where)}</span></div>`).join('');
  pList.querySelectorAll('.pal-item').forEach((el) => {
    el.addEventListener('mouseenter', () => { el.style.background = 'var(--color-fill-3)'; });
    el.addEventListener('mouseleave', () => { el.style.background = 'none'; });
    el.addEventListener('click', () => runCmd(Number(el.dataset.cmd)));
  });
  return hits;
}
let palCursor = 0;
function runCmd(i) { const c = palCur[i]; if (!c) return; openPalette(false); c.run?.(); }
function openPalette(open) {
  mask.style.display = open ? 'flex' : 'none';
  if (open) { pIn.value = ''; query = ''; buildPalette(''); palCursor = 0; pIn.focus(); icons(); }
}
document.addEventListener('keydown', (e) => {
  const open = mask.style.display === 'flex';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(!open); return; }
  if (!open) return;
  const items = [...pList.querySelectorAll('.pal-item')];
  if (e.key === 'Escape') { e.preventDefault(); openPalette(false); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!items.length) return;
    palCursor = (palCursor + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => { el.style.background = i === palCursor ? 'var(--color-fill-3)' : 'none'; });
  } else if (e.key === 'Enter') { e.preventDefault(); const el = items[palCursor]; if (el) runCmd(Number(el.dataset.cmd)); }
});
mask.addEventListener('click', (e) => { if (e.target === mask) openPalette(false); });
pIn.addEventListener('input', (e) => { query = e.target.value; buildPalette(query); palCursor = 0; });
document.getElementById('btnPalette').addEventListener('click', () => openPalette(true));
document.getElementById('btnSettings').addEventListener('click', () => go(makeRoute('settings', { section: 'settings' })));

// 外观
document.getElementById('btnTheme').addEventListener('click', () => {
  const dark = document.body.getAttribute('arco-theme') === 'dark';
  document.body.setAttribute('arco-theme', dark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  localStorage.setItem('workbench.scheme', dark ? 'light' : 'dark');
});
const densities = ['normal', 'compact', 'cozy'];
document.getElementById('btnDensity').addEventListener('click', () => {
  const cur = localStorage.getItem('workbench.density') || 'normal';
  const next = densities[(densities.indexOf(cur) + 1) % densities.length];
  localStorage.setItem('workbench.density', next);
});
(function restore() {
  const scheme = localStorage.getItem('workbench.scheme');
  if (scheme === 'light') { document.body.setAttribute('arco-theme', 'light'); document.documentElement.setAttribute('data-theme', 'light'); }
})();

// ══════════════════════════════════════════════════════════════════════
//  6. 自检（沿用 v3：路由与信息架构）
// ══════════════════════════════════════════════════════════════════════
function selfTest() {
  const results = [];
  const t = (name, fn) => {
    try { const v = fn(); results.push({ name, ok: v === true, detail: v === true ? '' : String(v) }); }
    catch (e) { results.push({ name, ok: false, detail: '抛异常: ' + e.message }); }
  };
  t('路由：会话路由可序列化并还原', () => { const r = makeRoute('conversation', { section: 'conversation', item: 'c3' }); const b = parseRoute(routeKey(r)); return b.view === 'conversation' && b.item === 'c3'; });
  t('路由：能力路由带分类', () => parseRoute(routeKey(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' }))).item === 'mcp');
  t('路由：非法视图回落到会话（不白屏）', () => parseRoute('nonsense/xx/yy').view === 'conversation');
  t('路由：空字符串不崩', () => parseRoute('').view === 'conversation');
  t('能力分类：五个分类齐全', () => CAP_KINDS.length === 5);
  t('能力分类：技能与 MCP 都在其中（这就是它们的家）', () => CAP_KINDS.some((c) => c.id === 'skills') && CAP_KINDS.some((c) => c.id === 'mcp'));
  t('能力分类：每类都有条目', () => CAP_KINDS.every((c) => capItems(c.id).length > 0));
  t('分类合法性：isValidKind 认得 skills / mcp', () => isValidKind('skills') && isValidKind('mcp') && !isValidKind('nope'));
  t('每个一级区都有图标（不再是字符占位）', () => SECTIONS.every((s) => !!s.icon) && CAP_KINDS.every((c) => !!c.icon));
  t('搜索：空查询返回空（不是返回全部）', () => searchAll('').length === 0);
  t('搜索：能搜到技能', () => searchAll('verify').some((x) => x.kind === '技能'));
  t('搜索：能搜到 MCP', () => searchAll('playwright').some((x) => x.kind === 'MCP'));
  t('搜索：无匹配返回空', () => searchAll('zzzzzz').length === 0);
  t('智能体的技能数不超过技能总数', () => AGENTS.every((a) => a.skills <= SKILLS.length));
  t('智能体的 MCP 数不超过 MCP 总数', () => AGENTS.every((a) => a.mcp <= MCP.length));
  t('每个会话都绑定了一个场景', () => CONVERSATIONS.every((c) => !!c.sc));
  t('深链接：view+kind 能还原能力页分类', () => { const r = parseRoute(routeKey(makeRoute('capabilities', { section: 'capabilities', item: 'mcp' }))); return r.view === 'capabilities' && isValidKind(r.item) && r.item === 'mcp'; });
  t('每个能力条目都能算出两列元信息（表格不会空列）', () => CAP_KINDS.every((c) => capItems(c.id).every((it) => { const [a, b] = capCell(c.id, it); return a !== undefined && b !== undefined; })));

  const bad = results.filter((r) => !r.ok);
  const out = [
    '  路由与信息架构自检  ' + (results.length - bad.length) + '/' + results.length + ' 成立',
    ...results.map((r) => '  ' + (r.ok ? '✓' : '✗') + ' ' + r.name + (r.detail ? '   ← ' + r.detail : '')),
    '  结论: ' + (bad.length ? '✗ ' + bad.length + ' 项不成立' : '✓ 全部成立'),
  ].join('\n');
  return { text: out, ok: bad.length === 0, pass: results.length - bad.length, total: results.length };
}

// ── 启动：URL 深链接优先 ──
const bootParams = new URLSearchParams(location.search);
const qView = bootParams.get('view');
const qKind = bootParams.get('kind');
const qItem = bootParams.get('item');
const saved = localStorage.getItem('workbench.route');
if (saved) route = parseRoute(saved);
if (qKind && isValidKind(qKind)) capKind = qKind;
if (qView) {
  if (qView === 'capabilities') route = makeRoute('capabilities', { section: 'capabilities', item: capKind });
  else if (qView === 'agents') route = makeRoute('agents', { section: 'agents', item: qItem || AGENTS[0].id });
  else if (qView === 'automation') route = makeRoute('automation', { section: 'automation' });
  else if (qView === 'settings') route = makeRoute('settings', { section: 'settings' });
  else route = makeRoute('conversation', { section: 'conversation', item: qItem || CONVERSATIONS[0].id });
}
if (route.item && isValidKind(route.item)) capKind = route.item;
render();

if (bootParams.get('selftest') === '1') {
  const r = selfTest();
  const el = document.getElementById('selftest');
  el.textContent = 'SELFTEST_BEGIN\n' + r.text + '\nSELFTEST_END\nRESULT ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
  el.style.display = 'block';
  document.title = 'SELFTEST ' + (r.ok ? 'OK' : 'FAIL') + ' ' + r.pass + '/' + r.total;
}
window.__selfTest = selfTest;
</script>
