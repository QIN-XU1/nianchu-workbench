<!--
  ══════════════════════════════════════════════════════════════════════
  BitFun（OpenBitFun）全量复刻
  ──────────────────────────────────────────────────────────────────────
  上游 github.com/GCWing/BitFun v1.0.10  —— 完整仓库 88.4MB / 10527 文件

  一、令牌：生成，不是手抄
     输入 design-system/packages/theme-openbitfun/src/{reference,light,dark}.tokens.json
          design-system/packages/design-tokens/src/system.tokens.json
     规则 design-system/packages/theme-openbitfun/scripts/build.mjs
     输出 bitfun/tokens.css —— 1476 处 --openbitfun-*

  二、外壳：取自源码
     src/web-ui/src/app/layout/AppLayout.scss         #root{border-radius:12px}
     src/web-ui/src/app/scenes/shell/ShellNav.scss    __header 40px / __terminal-list gap 2px
     src/web-ui/src/app/components/SceneBar/SceneBar.scss  标签是 pill 半径

  三、场景清单：取自 src/web-ui/src/app/scenes/registry.ts（SCENE_TAB_REGISTRY）
     personal-overview Home · session Session · terminal Terminal · git Git
     settings Settings · profile Profile · agents Agents · skills Skills
     ecosystem-compatibility External Import · miniapps Mini App · pages Pages
     browser Browser · assistant Assistant · todos Task Board · insights Insights
     shell Shell · project-resources Files

  四、每个场景的结构取自该目录的主组件：
     session   SessionScene.tsx   → ChatPane / TerminalPanelPosition / BottomTerminalPane
     agents    AgentsScene.tsx    → GalleryLayout / GalleryPageHeader / CapabilitySection / StatusPill
     skills    SkillsScene.tsx    → SearchField / Select / SkillsGrid / SkillCard / SkillsPagination
     settings  SettingsScene.tsx  → SettingsPage（左侧分类 + 右侧分区）
     git       GitScene.tsx       → WorkingCopyView / BranchesView / GraphView
     todos     TodosScene.tsx     → CronJob / TodoEditor / Dialog
     insights  InsightsScene.tsx  → AtAGlanceSection / StatsRow / ReportMetaCard
     pages     PagesScene.tsx     → GalleryLayout / GalleryEmpty
     miniapps  MiniAppGalleryScene→ TabGroup / MiniAppLibraryView
     ecosystem EcosystemCompat…   → ConfigPageSectionStack / Switch / Textarea
     browser   BrowserScene.tsx   → BrowserPreview / URL Input
     project-resources            → NavigationPanel / FileExplorerToolbar
     terminal / shell             → ConnectedTerminal

  诚实说明：外壳、Home、Session、Agents、Skills、Settings 是按源码结构与令牌复刻的；
  其余场景复刻了标题/分区/主要控件与空态，内容为示例数据（真实数据来自 Tauri 后端，
  静态页面无法取得）。
-->

// 渲染与路由
// ══════════════════════════════════════════════════════════════════════
let cur = 'personal-overview';
const open = ['personal-overview'];

function navHTML() {
  const main = SCENES.filter((s) => s.nav);
  return main.map((s) => `<button class="nav__item" data-go="${s.id}" ${cur === s.id ? 'aria-current="page"' : ''}>
    <span class="ico">${ICON(s.icon, 16)}</span>${s.label}</button>`).join('');
}
function scenebarHTML() {
  // SceneBar 只列"已打开的标签"，Home 常驻
  const tabs = SCENES.filter((s) => open.includes(s.id));
  return tabs.map((s) => `<button class="tab" data-go="${s.id}" ${cur === s.id ? 'aria-current="page"' : ''}>
    ${ICON(s.icon, 14)}${s.label}</button>`).join('') +
    `<span class="sp"></span><button class="iconbtn" title="收起侧栏">${ICON('panel-left',16)}</button>`;
}
function icons() { if (window.lucide?.createIcons) window.lucide.createIcons(); }

function render() {
  document.getElementById('navItems').innerHTML = navHTML();
  document.getElementById('scenebar').innerHTML = scenebarHTML();
  const v = VIEWS[cur] || (() => `<div class="empty">Not implemented</div>`);
  document.getElementById('view').innerHTML = v();
  icons();
  wire();
  location.hash = cur;
  document.title = 'OpenBitFun · ' + (SCENES.find((s) => s.id === cur)?.label || cur);
}
function go(id) {
  if (!SCENES.some((s) => s.id === id)) return;
  cur = id;
  if (!open.includes(id)) open.push(id);
  render();
}
function wire() {
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
  document.querySelectorAll('.switch').forEach((b) => b.addEventListener('click', () => {
    b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  }));
  const ta = document.querySelector('.composer textarea');
  if (ta) { const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }; ta.addEventListener('input', fit); fit(); }
}
document.getElementById('goSettings').addEventListener('click', () => go('settings'));

const start = (location.hash || '').replace('#', '');
render();
if (start && SCENES.some((s) => s.id === start)) go(start);

// 供验收读取
document.documentElement.setAttribute('data-scenes', String(SCENES.length));
window.__go = go;
window.__scenes = SCENES.map((s) => s.id);
</script>
