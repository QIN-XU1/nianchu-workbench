<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-label="念初 Nianchu">
  <!--
    念初 / Nianchu —— 标记（mask 版本）

    ── 借鉴到的手法 ─────────────────────────────────────────────
    抓了 lucide / tabler 的 badge-check、shield-check、stamp 作几何参考，
    取到两条：
      1. 轮廓用「多段小半径圆弧交替连接直边」（badge-check 的 `a4 4 0 0 1`），
         比圆角矩形更有张力；
      2. 顶尖标记靠**正负形**说话，不靠插图。所以要读得出"块"与"缺"。

    ── 契约 ──────────────────────────────────────────────────
    上游 brand/OpenBitFunBrandMotion.tsx 取所有 <path d="...">：
      第 1 条 = 内轮廓，最后 1 条 = 外轮廓；少于 2 条抛错。
    所以本文件刻意排成：内框 → 三格 → 外框。

    ── 设计 ──────────────────────────────────────────────────
    一枚印章：外框粗（120）、内框细（36）、中间三格实心。
    右下缺角 —— 第四态（判不了）不画出来，它本来就没有结论。

    为什么用"缺角"而不是"虚线格"：虚线在 16px 必糊成灰点（实测 48px 就丢），
    缺口是轮廓层面的，缩到任何尺寸都还在。
    ──────────────────────────────────────────────────────── -->

  <!-- ① 内轮廓（契约的 innerContour）：细内框，右下同角度断开 -->
  <path fill="none" stroke="#ffffff" stroke-width="36" stroke-linejoin="round"
        d="M 300 264
           H 724
           A 96 96 0 0 1 820 360
           V 560
           L 560 820
           H 300
           A 96 96 0 0 1 204 724
           V 360
           A 96 96 0 0 1 300 264 Z"/>

  <!-- ② ③ ④ 三格实心：确定的三种状态在场 -->
  <path fill="#ffffff" d="M 252 312 H 468 V 468 H 252 Z"/>
  <path fill="#ffffff" d="M 556 312 H 772 V 468 H 556 Z"/>
  <path fill="#ffffff" d="M 252 556 H 468 V 772 H 252 Z"/>

  <!-- ⑤ 外轮廓（契约的 outerContour）：粗外环，右下缺角 -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M 96 296
           A 200 200 0 0 1 296 96
           H 728
           A 200 200 0 0 1 928 296
           V 540
           L 540 928
           H 296
           A 200 200 0 0 1 96 728
           Z
           M 204 360
           A 96 96 0 0 1 300 264
           H 724
           A 96 96 0 0 1 820 360
           V 560
           L 560 820
           H 300
           A 96 96 0 0 1 204 724
           Z"/>
</svg>
